<!doctype html>
<html lang="en-GB">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>neptsBI</title>
  <meta name="dougs-wallboard" content="on">
  <!-- ?v=22 makes browsers fetch a matching set of files after each update -->
  <link rel="stylesheet" href="dougs.css?v=22">
  <link rel="stylesheet" href="neptsbi.css?v=22">
  <script src="dougs.js?v=22"></script>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.min.js"></script>
  <script src="neptsbi.js?v=22"></script>
</head>
<body>
  <header class="app-header">
    <div class="app-header__inner">
      <a class="app-header__title logo" href="#/">nepts<span class="logo__bi">BI</span></a>
      <nav class="app-header__nav" aria-label="Main">
        <a href="#/" data-nav="home">Dashboard</a>
        <a href="#/work" data-nav="work" hidden>Work <span class="nav-count" id="workCount" hidden></span></a>
        <a href="#/list?status=all" data-nav="list">Vehicles</a>
      </nav>
      <p class="who" id="who" hidden></p>
      <button class="hdr-search" type="button" id="findBtn" aria-label="Find a van" hidden>
        <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" aria-hidden="true"><circle cx="11" cy="11" r="7"/><path d="M20 20l-4-4"/></svg></button>
    </div>
  </header>

  <main id="main" class="container container--wide" tabindex="-1">
    <p class="status-line">Loading…</p>
  </main>

  <script>
  (function () {
    "use strict";
    const main = document.getElementById("main");
    const { esc, fmtDate, fmtNum, daysText, statusBadge, bookingBadge } = NB;
    let c = null;      // cached data
    let m = null;      // who is signed in
    let flash = "";    // one-off message shown on the next page

    const CHECKS = [   // rows of the check grid, in a fixed order, grouped
      { key: "mot", label: "MOT", live: true, group: "Vehicle" },
      { key: "service", label: "Service", live: true, group: "Vehicle" },
      { key: "clean", label: "Deep clean", group: "Vehicle" },
      { key: "oxygen", label: "Oxygen", group: "Vehicle" },
      { key: "defib", label: "Defib", group: "Vehicle" },
      { key: "fire", label: "Fire extinguisher", group: "Base" }
    ];
    const CHECK_NAME = { mot: "MOT", service: "Service" };

    // The status object for one check on one vehicle (MOT lives on the vehicle, service on v.svc)
    const S = (v, check) => check === "service" ? v.svc : v;

    /* ---------------- helpers ---------------- */

    function parseHash() {
      const raw = location.hash.replace(/^#\/?/, "");
      const [path, query] = raw.split("?");
      return { parts: (path || "").split("/").filter(Boolean).map(decodeURIComponent),
               q: new URLSearchParams(query || "") };
    }
    function link(path, params) {
      const q = new URLSearchParams();
      Object.entries(params || {}).forEach(([k, v]) => { if (v != null && v !== "") q.set(k, v); });
      const s = q.toString();
      return "#/" + path + (s ? "?" + s : "");
    }

    // What slice of the company is being looked at: "all", "r:<regionId>" or "b:<baseId>"
    function defaultView() {
      if (m.scope.level === "base") return "b:" + m.scope.baseId;
      if (m.scope.level === "region") return "r:" + m.scope.regionId;
      return "all";
    }
    function allowedView(view) {
      if (!view) return defaultView();
      const [kind, id] = view.split(":");
      if (m.scope.level === "company") return view;
      if (m.scope.level === "region") {
        if (kind === "r" && +id === m.scope.regionId) return view;
        if (kind === "b" && c.baseById.get(+id) && c.baseById.get(+id).region_id === m.scope.regionId) return view;
        return defaultView();
      }
      return defaultView();
    }
    function inView(v, view) {
      const [kind, id] = view.split(":");
      if (kind === "r") return v.region_id === +id;
      if (kind === "b") return v.base_id === +id;
      return true;
    }
    function viewName(view) {
      const [kind, id] = view.split(":");
      if (kind === "r") return c.regionById.get(+id).name;
      if (kind === "b") return c.baseById.get(+id).name;
      return "the whole company";
    }
    // short: phone heading style – ALL, then each region in capitals, then its bases as they are
    function viewOptions(current, short) {
      const opts = [];
      if (m.scope.level === "company") opts.push(["all", short ? "ALL" : "Whole company"]);
      c.regions.forEach(r => {
        if (m.scope.level === "company" || r.id === m.scope.regionId) {
          opts.push(["r:" + r.id, short ? r.name.toUpperCase() : (m.scope.level === "region" ? "All of " : "Region: ") + r.name]);
          c.bases.filter(b => b.region_id === r.id).forEach(b => opts.push(["b:" + b.id, (short ? "" : "  ") + b.name]));
        }
      });
      return opts.map(([v, l]) => `<option value="${v}"${v === current ? " selected" : ""}>${esc(l)}</option>`).join("");
    }

    function counts(list, check) {
      check = check || "mot";
      const st = list.map(v => S(v, check));
      const overdue = st.filter(s => s.status === "Overdue").length;
      return { total: list.length, overdue,
               soon: st.filter(s => s.status === "Due soon").length,
               notBooked: st.filter(s => s.status !== "OK" && !s.booked).length,
               compliance: list.length ? (list.length - overdue) / list.length * 100 : 100 };
    }

    // "Due" wording for a service: whichever of time or miles comes first
    function serviceDueText(s) {
      if (s.miles_left < 0) return `${fmtNum(-s.miles_left)} miles over`;
      if (s.due_date && s.due_date < NB.isoToday()) {
        const days = Math.round((NB.parseDate(s.due_date) - NB.parseDate(NB.isoToday())) / 864e5);
        return `${daysText(days)} (6 months up)`;
      }
      return `${fmtNum(s.miles_left)} miles left · by ${fmtDate(s.due_date)}`;
    }

    const DAYS = ["Mon", "Tue", "Wed", "Thu", "Fri", "Sat", "Sun"];
    const MONTHS = ["Jan", "Feb", "Mar", "Apr", "May", "Jun", "Jul", "Aug", "Sep", "Oct", "Nov", "Dec"];
    function shortDate(iso) { const d = NB.parseDate(iso); return d.getDate() + " " + MONTHS[d.getMonth()]; }
    function money(n) { return n == null ? "–" : "£" + Number(n).toLocaleString("en-GB", { maximumFractionDigits: 0 }); }

    function numLink(n, href, tone) {
      const cls = n === 0 ? "big-num big-num--zero" : "big-num" + (tone ? " big-num--" + tone : "");
      return `<a class="${cls}" href="${href}" aria-label="${n} – show the list">${n}</a>`;
    }
    function cellLink(n, href, cls) {
      return n ? `<a${cls ? ` class="${cls}"` : ""} href="${href}">${n}</a>` : "0";
    }

    function setNav(which) {
      document.querySelectorAll("[data-nav]").forEach(a => {
        if (a.dataset.nav === which) a.setAttribute("aria-current", "page"); else a.removeAttribute("aria-current");
      });
    }

    function flashHtml() {
      if (!flash) return "";
      const html = `<div class="alert alert--ok" role="status">${flash}</div>`;
      flash = "";
      return html;
    }

    /* ---------------- DASHBOARD (status only – the work lives on the Work page) ---------------- */

    /* ---------------- PHONE: the daily check ----------------
       Off the road (strict company rule, agreed 14 Oct): MOT expired, OR tested and the result not
       logged yet, OR last test a fail with no pass since. (To move into the database view later.) */
    const isPhone = () => window.matchMedia("(max-width: 700px)").matches;
    function offRoad(v) { return v.status === "Overdue" || !!v.awaiting_result || v.last_test_result === "Fail"; }
    // kind "overdue" or "soon" (coming up in the warning window, not booked), for one check
    function phoneBucket(v, check, kind) {
      if (check === "mot") return kind === "overdue" ? offRoad(v) : (!offRoad(v) && v.status === "Due soon" && !v.booked);
      const s = v.svc;
      return kind === "overdue" ? (s.status === "Overdue" || !!s.awaiting_result) : (s.status === "Due soon" && !s.booked && !s.awaiting_result);
    }
    const phoneCount = (list, check, kind) => list.filter(v => phoneBucket(v, check, kind)).length;

    function renderPhoneHome(q) {
      setNav("home");
      const view = allowedView(q.get("view"));
      const list = c.vehicles.filter(v => inView(v, view));
      const canChoose = m.scope.level !== "base";
      const vq = view === defaultView() ? "" : view;
      // Narrowed to one check (tap a number or a check name); the phone's back button undoes it
      const fCheck = CHECKS.some(ch => ch.live && ch.key === q.get("check")) ? q.get("check") : "";
      const fKind = fCheck && ["overdue", "soon"].includes(q.get("kind")) ? q.get("kind") : "";
      const num = (check, kind) => {
        const n = phoneCount(list, check, kind);
        const cls = n === 0 ? "ph-n ph-n--ok" : kind === "overdue" ? "ph-n ph-n--bad" : "ph-n ph-n--warn";
        const on = fCheck === check && fKind === kind;
        return `<a class="${cls}${on ? " ph-n--on" : ""}" href="${link("", on ? { view: vq, check } : { view: vq, check, kind })}" aria-label="${n} – show the vans">${n}</a>`;
      };
      const title = ch => `<a class="ph-check" href="${link("", fCheck === ch.key ? { view: vq } : { view: vq, check: ch.key })}">${ch.label}</a>`;
      let html = (canChoose
          ? `<label for="phView" class="visually-hidden">Showing</label><select id="phView" class="ph-title-select">${viewOptions(view, true)}</select>`
          : `<h1 style="margin:0">${esc(viewName(view))}</h1>`) +
        `<p class="ph-sub">${fmtNum(list.length)} vehicles</p>
        <div class="ph-grid"><table>
          <thead><tr><th><span class="visually-hidden">Check</span></th><th scope="col">Overdue</th><th scope="col">Pending</th></tr></thead>
          <tbody>${CHECKS.filter(ch => !fCheck || ch.key === fCheck).map(ch => (ch.live
            ? `<tr><th scope="row">${title(ch)}</th><td>${num(ch.key, "overdue")}</td><td>${num(ch.key, "soon")}</td></tr>`
            : `<tr><th scope="row">${ch.label}</th><td><span class="ph-n ph-n--ok" title="Coming soon">0</span></td><td><span class="ph-n ph-n--ok" title="Coming soon">0</span></td></tr>`)).join("")}</tbody>
        </table></div>`;

      const oneBase = view.startsWith("b:");
      if (oneBase || fCheck) {
        // The list: everything to do, overdue first, then by due date
        const items = [];
        CHECKS.filter(ch => ch.live && (!fCheck || ch.key === fCheck)).forEach(ch =>
          ["overdue", "soon"].filter(k => !fKind || k === fKind).forEach(kind =>
            list.filter(v => phoneBucket(v, ch.key, kind)).forEach(v => items.push({ v, check: ch.key, kind }))));
        const dueOf = it => it.check === "service" ? it.v.svc.effective_due_date : it.v.due_date;
        items.sort((a, b) => (a.kind === b.kind ? 0 : a.kind === "overdue" ? -1 : 1) || dueOf(a).localeCompare(dueOf(b)));
        const dueCell = it => {
          const d = dueOf(it), late = d < today();
          // Off the road although the date hasn't come yet (not logged, failed): say why – unless the Status column does
          if (it.kind === "overdue" && !late) return shortDate(d);   // the Status column says why (not logged, failed)
          return `<span class="${it.kind === "overdue" ? "text-danger" : ""}">${shortDate(d)}</span>`;
        };
        const status = it => {
          const s = S(it.v, it.check);
          if (s.awaiting_result) return `<span class="text-danger">Not logged</span>`;
          if (it.check === "mot" && it.v.last_test_result === "Fail" && !s.booked) return `<span class="text-danger">Failed</span>`;
          return s.booked ? `Booked ${shortDate(s.booking_date)}` : `<span class="${it.kind === "overdue" ? "text-danger" : "text-warn"}">Not booked</span>`;
        };
        // One list per check, so people can look, prioritise and act on one thing at a time.
        // Narrowed to one check: Overdue and Pending as two tables (like the Power BI page) – overdue is the work.
        const checks = CHECKS.filter(ch => ch.live && (!fCheck || ch.key === fCheck)).map(ch => ch.key);
        const table = (rows, ck, withStatus) => `<div class="ph-list"><table>
            <thead><tr><th>Reg</th><th>${CHECK_NAME[ck]} due</th>${withStatus ? "<th>Status</th>" : ""}</tr></thead>
            <tbody>${rows.map(it => `<tr data-open="${esc(it.v.registration)}" data-check="${it.check}" tabindex="0">
              <td><span class="reg">${esc(it.v.registration)}</span>${oneBase ? "" : `<div class="small muted">${esc(it.v.base_name)}</div>`}</td>
              <td>${dueCell(it)}</td>${withStatus ? `<td>${status(it)}</td>` : ""}
            </tr>`).join("")}</tbody>
          </table></div>`;
        // Front page: Overdue first (a table per check), then Pending (a table per check).
        // One check: just its Overdue and Pending tables.
        const kinds = ["overdue", "soon"].filter(k => !fKind || k === fKind);
        const tables = kinds.map(k => {
          const name = k === "overdue" ? "Overdue" : "Pending";
          const inKind = items.filter(it => it.kind === k);
          if (fCheck) return `<h2 class="ph-list-title">${name} <span class="muted">(${inKind.length})</span></h2>` +
            (inKind.length ? table(inKind, fCheck, k === "overdue") : `<p class="muted" style="margin:0">None.</p>`);
          return `<h2 class="ph-list-title">${name} <span class="muted">(${inKind.length})</span></h2>` +
            (inKind.length ? checks.map(ck => {
              const part = inKind.filter(it => it.check === ck);
              return part.length ? `<h3 class="ph-list-sub">${CHECK_NAME[ck]} <span class="muted">(${part.length})</span></h3>${table(part, ck, k === "overdue")}` : "";
            }).join("") : `<p class="muted" style="margin:0">None.</p>`);
        }).join("");
        html += tables || `<div class="empty" style="margin-top:var(--space-4)">Nothing to do – all green.</div>`;
      } else {
        // Regional / operations, nothing narrowed: one line per base, worst first
        const bases = c.bases.filter(b => view === "all" || "r:" + b.region_id === view).map(b => {
          const bl = list.filter(v => v.base_id === b.id);
          const over = ["mot", "service"].reduce((n, ch) => n + phoneCount(bl, ch, "overdue"), 0);
          const soon = ["mot", "service"].reduce((n, ch) => n + phoneCount(bl, ch, "soon"), 0);
          return { b, over, soon };
        }).sort((a, b) => b.over - a.over || b.soon - a.soon || a.b.name.localeCompare(b.b.name));
        const cc = (n, t) => `<span class="c ${n ? "c--" + t : "c--ok"}">${n}</span>`;
        html += `<div class="ph-bases" style="margin-top:var(--space-4)">
          <div class="hd"><span class="nm">By base</span><span class="c">Overdue</span><span class="c">Pending</span></div>
          ${bases.map(x => `<a href="${link("", { view: "b:" + x.b.id })}"><span class="nm">${esc(x.b.name)} <span class="muted">›</span></span>${cc(x.over, "bad")}${cc(x.soon, "warn")}</a>`).join("")}
        </div>`;
      }
      main.innerHTML = html;
      main.querySelectorAll("tr[data-open]").forEach(tr => {
        const go = () => openVanPanel(tr.dataset.open, tr.dataset.check);
        tr.addEventListener("click", go);
        tr.addEventListener("keydown", e => { if (e.key === "Enter" || e.key === " ") { e.preventDefault(); go(); } });
      });
      const sel = document.getElementById("phView");
      if (sel) {
        // A dropdown is as wide as its longest name; size it to the chosen one so the arrow sits by the word
        const probe = document.createElement("span");
        probe.style.cssText = "position:absolute;visibility:hidden;white-space:pre";
        probe.style.font = getComputedStyle(sel).font;
        probe.textContent = sel.selectedOptions[0].textContent;
        document.body.appendChild(probe);
        sel.style.width = Math.ceil(probe.getBoundingClientRect().width) + 40 + "px";
        probe.remove();
        sel.addEventListener("change", () => { location.hash = link("", { view: sel.value }); });
        sel.addEventListener("blur", () => sel.blur());
      }
    }

    // Behind a number: a plain list – reg, what's wrong, booking. Tap a row for the details panel.
    function shortWhy(v, check) {
      const s = S(v, check);
      if (check === "service") {
        if (s.awaiting_result) return "Not logged";
        if (s.miles_left < 0) return `${fmtNum(-s.miles_left)} miles over`;
        const d = NB.daysBetween(today(), s.effective_due_date);
        return d < 0 ? `${-d} day${d === -1 ? "" : "s"} over` : `Due ${shortDate(s.effective_due_date)}`;
      }
      if (v.awaiting_result) return "Not logged";
      if (v.last_test_result === "Fail") return "Failed";
      const d = v.days_to_due;
      return d < 0 ? `Expired ${-d === 1 ? "1 day" : -d + " days"}` : `Due ${shortDate(v.due_date)}`;
    }
    function shortBooking(v, check) {
      const s = S(v, check);
      if (s.awaiting_result) return `Tested ${shortDate(s.booking_date)}`;
      return s.booked ? `Booked ${shortDate(s.booking_date)}` : `<span class="text-danger">Not booked</span>`;
    }

    function renderTodo(q) {
      setNav("home");
      const check = q.get("check") === "service" ? "service" : "mot";
      const kind = q.get("kind") === "soon" ? "soon" : "overdue";
      const view = allowedView(q.get("view"));
      const isSvc = check === "service";
      const list = c.vehicles.filter(v => inView(v, view) && phoneBucket(v, check, kind))
        .sort((a, b) => dueSort(a, b, check));
      main.innerHTML = `<a class="back-link" href="${link("", { view: view === defaultView() ? "" : view })}">${esc(view === "all" ? "Whole company" : viewName(view))}</a>
        <h1 style="margin:0">${isSvc ? "Service" : "MOT"} – ${kind === "overdue" ? "overdue" : "pending"} <span class="muted">(${list.length})</span></h1>
        <p class="ph-sub">${kind === "overdue" ? (isSvc ? "Past the date or the miles" : "Off the road until sorted") : `Due in the next ${c.rules[isSvc ? "service_warning_days" : "mot_warning_days"].value} days, not booked`}</p>
        ${list.length ? `<div class="ph-list"><table>
            <thead><tr><th>Reg</th><th>${kind === "overdue" ? "Problem" : "Due"}</th><th>${kind === "overdue" ? "Booking" : ""}</th><th><span class="visually-hidden">Open</span></th></tr></thead>
            <tbody>${list.map(v => `<tr data-open="${esc(v.registration)}" tabindex="0">
              <td><span class="reg">${esc(v.registration)}</span>${m.scope.level === "base" ? "" : `<div class="small muted">${esc(v.base_name)}</div>`}</td>
              <td>${shortWhy(v, check)}</td>
              <td class="small">${kind === "overdue" ? shortBooking(v, check) : `in ${isSvc ? NB.daysBetween(today(), v.svc.effective_due_date) : v.days_to_due} days`}</td>
              <td class="chev" aria-hidden="true">›</td></tr>`).join("")}</tbody>
          </table></div>` : `<div class="empty">Nothing here – all sorted.</div>`}`;
      main.querySelectorAll("tr[data-open]").forEach(tr => {
        const go = () => openVanPanel(tr.dataset.open, check);
        tr.addEventListener("click", go);
        tr.addEventListener("keydown", e => { if (e.key === "Enter" || e.key === " ") { e.preventDefault(); go(); } });
      });
    }

    // The admin panel for one van: the details and the thing to do. With a check, just that check;
    // without (from search), MOT and service one under the other.
    function vanSection(v, check) {
      const s = S(v, check), isSvc = check === "service", reg = esc(v.registration);
      const row = (k, val) => `<dt>${k}</dt><dd>${val}</dd>`;
      const facts = isSvc
        ? row("Service", esc(svcWhat(s))) +
          row("Next due", `${fmtNum(s.due_odometer)} miles or ${NB.fmtDay(s.due_date)}`) +
          row("Last service", s.last_service_date ? `${esc(s.last_service_type)} · ${NB.fmtDay(s.last_service_date)}` : "None yet") +
          row("Booking", s.booked ? `${NB.fmtDay(s.booking_date)} · ${esc(s.booking_provider || "")}` : "Not booked")
        : row("Status", offRoad(v) ? '<span class="text-danger" style="font-weight:700">Off the road</span>' : '<span class="text-ok" style="font-weight:700">OK to use</span>') +
          (offRoad(v) || v.status !== "OK" ? row("Problem", shortWhy(v, check)) : "") +
          row("MOT " + (v.days_to_due < 0 ? "expired" : "runs to"), NB.fmtDay(v.due_date)) +
          row("Last test", v.last_test_date ? `${esc(v.last_test_result)} · ${NB.fmtDay(v.last_test_date)}` : "None yet") +
          row("Booking", v.booked ? `${NB.fmtDay(v.booking_date)} · ${esc(v.booking_centre || "")}` : "Not booked");
      const action = !m.role.can_record ? "" : s.awaiting_result
        ? `<button class="btn btn--primary" type="button" data-log="${reg}" data-kind="${check}">Log ${isSvc ? "service" : "result"}</button>`
        : s.booked
          ? `<button class="btn btn--ghost" type="button" data-book="${reg}" data-kind="${check}">Change booking</button>`
          : `<button class="btn ${s.status === "OK" && !(check === "mot" && v.last_test_result === "Fail") ? "btn--ghost" : "btn--primary"}" type="button" data-book="${reg}" data-kind="${check}">${isSvc ? "Book service" : v.last_test_result === "Fail" ? "Book retest" : "Book MOT"}</button>`;
      return { facts: `<dl class="facts" style="font-size:var(--text-md);row-gap:var(--space-2)">${facts}</dl>`, action };
    }
    function openVanPanel(reg, check) {
      const v = c.vehicleByReg.get(reg);
      const p = NB.openPanel(reg);
      const intro = `<p class="muted" style="margin-top:0">${esc(v.make)} ${esc(v.model)} · ${esc(v.class_short)} · ${esc(v.base_name)}</p>`;
      const more = `<p style="margin-top:var(--space-4)"><a href="${link("van/" + reg)}">Full vehicle record ›</a></p>`;
      if (check) {
        const sec = vanSection(v, check);
        p.el.innerHTML = `<div class="panel__body">${intro}${sec.facts}${more}</div>${sec.action ? `<div class="panel__foot">${sec.action}</div>` : ""}`;
      } else {
        p.el.innerHTML = `<div class="panel__body">${intro}${["mot", "service"].map(ch => {
            const sec = vanSection(v, ch);
            return `<h3 class="panel-sec">${CHECK_NAME[ch]}</h3>${sec.facts}${sec.action ? `<div style="margin-top:var(--space-3)">${sec.action}</div>` : ""}`;
          }).join("")}${more}</div>`;
      }
      wireActions(p.el, check || "mot");
    }

    // Find one van: search icon in the header → type part of the reg → its panel
    function openFind() {
      const p = NB.openPanel("Find a van");
      const mine = c.vehicles.filter(v => inView(v, defaultView()) || m.scope.level === "company");
      p.el.innerHTML = `<div class="panel__body">
          <div class="field"><label for="findReg">Reg or fleet number</label>
            <input class="input" id="findReg" autocomplete="off" spellcheck="false" placeholder="e.g. 058"></div>
          <ul class="find-list" id="findList"></ul>
        </div>`;
      const inp = p.el.querySelector("#findReg"), ul = p.el.querySelector("#findList");
      const draw = () => {
        const t = normReg(inp.value);
        const hits = t ? mine.filter(v => normReg(v.registration).includes(t) || normReg(v.fleet_number).includes(t)).slice(0, 20) : [];
        ul.innerHTML = t && !hits.length ? `<li class="muted" style="padding:12px 0">No van matching “${esc(inp.value)}”.</li>`
          : hits.map(v => `<li><button type="button" data-reg="${esc(v.registration)}"><span class="reg">${esc(v.registration)}</span>
              <span class="small muted">${esc(v.make)} ${esc(v.model)}${m.scope.level === "base" ? "" : " · " + esc(v.base_name)}</span>
              ${offRoad(v) ? '<span class="small text-danger" style="margin-left:auto;font-weight:700">Off road</span>' : ""}</button></li>`).join("");
      };
      inp.addEventListener("input", draw);
      inp.addEventListener("keydown", e => { if (e.key === "Enter") { e.preventDefault(); const first = ul.querySelector("[data-reg]"); if (first) openVanPanel(first.dataset.reg); } });
      ul.addEventListener("click", e => { const b = e.target.closest("[data-reg]"); if (b) openVanPanel(b.dataset.reg); });
      inp.focus();
    }

    function renderHome(q) {
      setNav("home");
      if (m.role.key === "driver") return renderDriverHome();
      if (isPhone()) return renderPhoneHome(q);

      const view = allowedView(q.get("view"));
      const list = c.vehicles.filter(v => inView(v, view));
      const k = counts(list, "mot"), ks = counts(list, "service");
      const all = c.vehicles, ka = counts(all, "mot"), ksa = counts(all, "service");
      const L = (status, check) => link("list", { status, view, check: check === "service" ? "service" : "" });
      const canChoose = m.scope.level !== "base";
      const svcOnTime = list.length ? (list.length - ks.overdue) / list.length * 100 : 100;
      const svcOnTimeAll = all.length ? (all.length - ksa.overdue) / all.length * 100 : 100;
      const miles7 = list.reduce((s, v) => s + v.miles_7, 0);
      const miles30 = list.reduce((s, v) => s + v.miles_30, 0), vanDays = list.reduce((s, v) => s + v.days_used_30, 0);
      const vor = list.filter(v => v.status === "Overdue");

      let html = `<div class="page-head">
          <div class="grow">
            <h1>${esc(view === "all" ? "Whole company" : viewName(view))}</h1>

          </div>
          ${canChoose ? `<div class="field" style="min-width:220px">
              <label for="viewSelect" class="visually-hidden">Showing</label>
              <select id="viewSelect">${viewOptions(view)}</select>
            </div>` : ""}
        </div>`;

      html += `<div class="kpis">
          <a class="kpi" href="${L("overdue")}">
            <div class="kpi__label">Off the road (VOR)</div>
            <div class="kpi__value${vor.length ? " kpi__value--bad" : ""}">${vor.length}</div>
            <div class="kpi__sub">${vor.length ? "No valid MOT" : "Every van has a valid MOT"}</div>
          </a>
          <a class="kpi" href="${L("all")}">
            <div class="kpi__label">MOT compliant</div>
            <div class="kpi__value">${k.compliance.toFixed(1)}%</div>
            <div class="kpi__sub">${view === "all" ? `${fmtNum(k.total - k.overdue)} of ${fmtNum(k.total)} vans` : `Company ${ka.compliance.toFixed(1)}%`}</div>
          </a>
          <a class="kpi" href="${L("all", "service")}">
            <div class="kpi__label">Service on time</div>
            <div class="kpi__value">${svcOnTime.toFixed(1)}%</div>
            <div class="kpi__sub">${view === "all" ? `${ks.overdue} overdue` : `Company ${svcOnTimeAll.toFixed(1)}%`}</div>
          </a>
          <a class="kpi" href="${link("list", { status: "all", view, sort: "miles" })}">
            <div class="kpi__label">Miles – last 7 days</div>
            <div class="kpi__value">${fmtNum(miles7)}</div>
            <div class="kpi__sub">${vanDays ? fmtNum(Math.round(miles30 / vanDays)) : "–"} a van per working day</div>
          </a>
        </div>`;

      // Checks: one row per check, a small bar, and the numbers behind it
      const row = ch => {
        if (!ch.live) return `<tr class="soon"><th scope="row">${ch.label}</th><td class="bar-cell"></td><td colspan="3">Coming soon</td></tr>`;
        const kc = counts(list, ch.key), ok = kc.total - kc.overdue - kc.soon;
        const pct = n => kc.total ? (n / kc.total * 100).toFixed(2) + "%" : "0";
        const n = (val, status, cls) => val ? `<a class="${cls || ""}" href="${L(status, ch.key)}">${val}</a>` : `<span class="muted">0</span>`;
        return `<tr><th scope="row">${ch.label}</th>
          <td class="bar-cell"><div class="sbar" role="img" aria-label="${ok} OK, ${kc.soon} due soon, ${kc.overdue} overdue">
            <span class="ok" style="width:${pct(ok)}"></span><span class="soon" style="width:${pct(kc.soon)}"></span><span class="bad" style="width:${pct(kc.overdue)}"></span></div></td>
          <td>${n(ok, "ok")}</td><td>${n(kc.soon, "due", "n-warn")}</td><td>${n(kc.overdue, "overdue", "n-bad")}</td></tr>`;
      };
      html += `<h2 class="section-title">Checks</h2>
        <div class="dash-card" style="padding:4px 4px">
          <table class="status-table">
            <thead><tr><th scope="col" style="text-align:left"><span class="visually-hidden">Check</span></th><th class="bar-cell"><span class="visually-hidden">Picture</span></th>
              <th scope="col">OK</th><th scope="col">Due in ${c.rules.mot_warning_days ? c.rules.mot_warning_days.value : 30} days</th><th scope="col">Overdue</th></tr></thead>
            <tbody>${CHECKS.map(row).join("")}</tbody>
          </table>
        </div>`;

      // MOTs due by week, and compliance over the last 12 weeks
      const monday = NB.isoToday(-((new Date().getDay() + 6) % 7));
      const weeks = Array.from({ length: 8 }, (_, i) => {
        const start = addDays(monday, i * 7), end = addDays(start, 7);
        const n = list.filter(v => v.due_date >= start && v.due_date < end).length;
        return { label: i === 0 ? "This wk" : shortDate(start), value: n, tip: `Week of ${shortDate(start)}: ${n} MOT${n === 1 ? "" : "s"} due` };
      });
      const trendDays = Array.from({ length: 12 }, (_, i) => NB.isoToday(-(11 - i) * 7));
      const mine = trendDays.map(d => complianceOn(list, d)), company = trendDays.map(d => complianceOn(all, d));
      // Axis from a whole number up to 100, with an even span so the middle line is a whole number too
      let span = Math.ceil(100 - Math.min(...mine, ...company) + 0.5); if (span % 2) span++;
      const lo = Math.max(0, 100 - span), hi = 100;
      const series = [{ values: mine }];
      if (view !== "all") series.push({ values: company, cmp: true });
      html += `<div class="grid grid--fit" style="--min: 340px; margin-top: var(--space-4)">
          <article class="dash-card chart-card">
            <h2>MOTs due – next 8 weeks</h2><p class="card__desc">How busy the coming weeks are</p>
            ${NB.barChart(weeks, { ariaLabel: "MOTs due per week for the next 8 weeks", labelEvery: 1, width: 440, height: 170 })}
            ${NB.chartTable(weeks.map(w => [w.label, String(w.value)]), ["Week", "MOTs due"])}
          </article>
          <article class="dash-card chart-card">
            <h2>MOT compliance – last 12 weeks</h2><p class="card__desc">${view === "all" ? "Whole company" : esc(viewName(view)) + " against the company"}</p>
            ${NB.lineChart(series, { min: lo, max: hi, width: 440, height: 170, fmt: v => v.toFixed(0) + "%",
                labels: trendDays.map(shortDate), labelEvery: 3, ariaLabel: "MOT compliance over the last 12 weeks",
                tips: trendDays.map((d, i) => `${shortDate(d)}: ${mine[i].toFixed(1)}%${view !== "all" ? ` (company ${company[i].toFixed(1)}%)` : ""}`) })}
            ${view !== "all" ? `<div class="legend"><span><i></i>${esc(viewName(view))}</span><span><i class="cmp"></i>Company</span></div>` : ""}
          </article>
        </div>`;

      html += mileageSection(list, view);

      // Company / region: break down by base
      if (view === "all" || view.startsWith("r:")) {
        const regions = c.regions.filter(r => view === "all" || "r:" + r.id === view);
        const rows = [];
        regions.forEach(r => {
          c.bases.filter(b => b.region_id === r.id).forEach(b => {
            const bv = "b:" + b.id;
            const bl = list.filter(v => v.base_id === b.id);
            const bk = counts(bl, "mot"), bs = counts(bl, "service");
            const LL = (status, check) => link("list", { status, view: bv, check: check === "service" ? "service" : "" });
            rows.push(`<tr>
              <td>${esc(r.name)}</td>
              <td><a href="${link("", { view: bv })}">${esc(b.name)}</a></td>
              <td class="num"><a href="${LL("all")}">${bk.total}</a></td>
              <td class="num">${cellLink(bk.overdue, LL("overdue"), "text-danger")}</td>
              <td class="num">${cellLink(bk.soon, LL("due"))}</td>
              <td class="num">${cellLink(bs.overdue, LL("overdue", "service"), "text-danger")}</td>
              <td class="num">${cellLink(bs.soon, LL("due", "service"))}</td>
              <td class="num">${bk.compliance.toFixed(1)}%</td>
              <td class="num"><a href="${link("list", { status: "all", view: bv, sort: "miles" })}">${fmtNum(bl.reduce((s, v) => s + v.miles_30, 0))}</a></td>
            </tr>`);
          });
        });
        html += `<h2 class="section-title">By base</h2>
          <div class="table-wrap"><table class="table">
            <thead><tr><th>Region</th><th>Base</th><th class="num">Vans</th>
              <th class="num">MOT overdue</th><th class="num">MOT due soon</th>
              <th class="num">Service overdue</th><th class="num">Service due soon</th>
              <th class="num">MOT compliant</th><th class="num">Miles (30 days)</th></tr></thead>
            <tbody>${rows.join("")}</tbody></table></div>`;
      }
      html += `<p class="work-note">Click any number to see the vans behind it.</p>`;

      main.innerHTML = html;
      const sel = document.getElementById("viewSelect");
      if (sel) sel.addEventListener("change", () => { location.hash = link("", { view: sel.value }); });
    }

    function addDays(iso, n) { const d = NB.parseDate(iso); d.setDate(d.getDate() + n); return d.getFullYear() + "-" + String(d.getMonth() + 1).padStart(2, "0") + "-" + String(d.getDate()).padStart(2, "0"); }

    // Share of vans with a valid MOT on a day: covered by a pass, or first MOT not due yet
    let passesByVan = null;
    function complianceOn(list, day) {
      if (!passesByVan) {
        passesByVan = new Map();
        c.passes.forEach(p => { if (!passesByVan.has(p.vehicle_id)) passesByVan.set(p.vehicle_id, []); passesByVan.get(p.vehicle_id).push(p); });
      }
      if (!list.length) return 100;
      const ok = list.filter(v => {
        if (addDays(v.first_registered, 0) > day) return true;
        const firstDue = NB.parseDate(v.first_registered); firstDue.setFullYear(firstDue.getFullYear() + 3);
        if (NB.parseDate(day) < firstDue) return true;
        return (passesByVan.get(v.id) || []).some(p => p.test_date <= day && p.expiry_date >= day);
      }).length;
      return ok / list.length * 100;
    }

    // Mileage section for a list of vehicles (any slice of the company)
    function mileageSection(list, view) {
      const baseIds = new Set(list.map(v => v.base_id));
      const miles30 = list.reduce((s, v) => s + v.miles_30, 0);
      const vanDays = list.reduce((s, v) => s + v.days_used_30, 0);
      const weeks = new Map();
      c.weekly.filter(w => baseIds.has(w.base_id)).forEach(w => weeks.set(w.week_start, (weeks.get(w.week_start) || 0) + w.miles));
      const thisMonday = NB.isoToday(-((new Date().getDay() + 6) % 7));
      const full = [...weeks.entries()].sort((a, b) => a[0].localeCompare(b[0])).filter(([d]) => d < thisMonday).slice(-26);
      const weekData = full.map(([d, mi]) => ({ label: shortDate(d), value: mi, tip: "Week of " + shortDate(d) + ": " + fmtNum(mi) + " miles" }));
      const dow = DAYS.map((name, i) => {
        const rows = c.weekday.filter(r => baseIds.has(r.base_id) && r.dow === i + 1);
        const mi = rows.reduce((s, r) => s + r.miles, 0), vd = rows.reduce((s, r) => s + r.van_days, 0);
        const avg = vd ? Math.round(mi / vd) : 0;
        return { label: name, value: avg, tip: name + ": " + avg + " miles per van" };
      });
      return `<h2 class="section-title">Mileage</h2>
        <div class="tiles">
          <a class="tile tile--info" href="${link("list", { status: "all", view, sort: "miles" })}"><div class="tile__value">${fmtNum(miles30)}</div><div class="tile__label">Miles – last 30 days</div></a>
          <div class="tile tile--info"><div class="tile__value">${vanDays ? fmtNum(Math.round(miles30 / vanDays)) : "–"}</div><div class="tile__label">Miles per van per working day</div></div>
          <div class="tile tile--info"><div class="tile__value">${list.length ? Math.round(vanDays / list.length / 30 * 100) : 0}%</div><div class="tile__label">Van-days used (last 30 days)</div></div>
        </div>
        <div class="grid grid--fit" style="--min: 320px; margin-top: var(--space-4)">
          <article class="card card--plain chart-card">
            <h3>Miles per week</h3><p class="card__desc">Last 26 weeks · ${esc(viewName(view))}</p>
            ${NB.barChart(weekData, { ariaLabel: "Miles per week, last 26 weeks", labelEvery: 6, width: 420 })}
            ${NB.chartTable(weekData.map(d => ["Week of " + d.label, fmtNum(d.value)]), ["Week", "Miles"])}
          </article>
          <article class="card card--plain chart-card">
            <h3>Busiest days</h3><p class="card__desc">Average miles per van, last 13 weeks</p>
            ${NB.barChart(dow, { ariaLabel: "Average miles per van by day of the week", labelEvery: 1, width: 420 })}
            ${NB.chartTable(dow.map(d => [d.label, fmtNum(d.value)]), ["Day", "Miles per van"])}
          </article>
        </div>`;
    }

    function renderDriverHome() {
      const base = c.baseById.get(m.person.base_id);
      const list = c.vehicles.filter(v => v.base_id === base.id);
      const off = list.filter(v => v.status === "Overdue");
      const svcOver = list.filter(v => v.svc.status === "Overdue");
      main.innerHTML = flashHtml() + `
        <p class="card__eyebrow">${esc(m.role.label)} · ${esc(base.name)}</p>
        <h1>Hello, ${esc(m.person.name)}</h1>
        <div class="grid" style="--min: 280px">
          <article class="card card--info">
            <div class="card__eyebrow">Today</div>
            <h2 class="card__title">Your checks</h2>
            <ul class="item-list">
              <li>Daily vehicle check <span class="badge badge--neutral">Coming soon</span></li>
              <li>Base checks assigned to you <span class="badge badge--neutral">Coming soon</span></li>
              <li>How-to guide for each check <span class="badge badge--neutral">Coming soon</span></li>

          <article class="card ${off.length ? "card--danger" : "card--ok"}">
