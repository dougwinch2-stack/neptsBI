              <p class="card__desc">Don't take these out until the MOT is done.</p>`
              : `<p class="card__desc">Every vehicle at ${esc(base.name)} has a valid MOT.</p>`}
          </article>
          ${svcOver.length ? `<article class="card card--warn">
            <div class="card__eyebrow">${esc(base.name)}</div>
            <h2 class="card__title">Service overdue</h2>
            <ul class="item-list">${svcOver.map(v =>
              `<li><a class="reg" href="${link("van/" + v.registration)}">${esc(v.registration)}</a> – ${serviceDueText(v.svc)}${v.svc.booked ? `, booked ${fmtDate(v.svc.booking_date)}` : ""}</li>`).join("")}</ul>
            <p class="card__desc">Tell the base manager if you're given one of these.</p>
          </article>` : ""}
        </div>`;
    }
    /* ---------------- LIST (drill-down) ---------------- */

    const STATUS_WORDS = { overdue: "overdue", due: "due soon", notbooked: "needs booking", ok: "OK", all: "" };

    function dueSort(a, b, check) {
      if (check === "service") {
        const sa = a.svc, sb = b.svc;
        return (sa.effective_due_date || "").localeCompare(sb.effective_due_date || "") || a.registration.localeCompare(b.registration);
      }
      return a.days_to_due - b.days_to_due || a.registration.localeCompare(b.registration);
    }

    function renderList(q) {
      const check = q.get("check") === "service" ? "service" : "mot";
      const status = STATUS_WORDS[q.get("status")] != null ? q.get("status") : "all";
      const view = allowedView(q.get("view"));
      setNav(status === "all" && view === defaultView() && !q.get("sort") ? "list" : "");
      let list = c.vehicles.filter(v => inView(v, view));
      const st = v => S(v, check);
      if (status === "overdue") list = list.filter(v => st(v).status === "Overdue");
      if (status === "due") list = list.filter(v => st(v).status === "Due soon");
      if (status === "notbooked") list = list.filter(v => st(v).status !== "OK" && !st(v).booked);
      if (status === "ok") list = list.filter(v => st(v).status === "OK");
      const search = (q.get("find") || "").trim().toUpperCase();
      if (search) list = list.filter(v =>
        (v.registration + " " + v.fleet_number + " " + v.make + " " + v.model + " " + v.class_short).toUpperCase().includes(search));
      const SORTS = { due: "Due date", miles: "Most miles (30 days)", fewest: "Fewest miles (30 days)", reg: "Registration" };
      const sort = SORTS[q.get("sort")] ? q.get("sort") : "due";
      const byReg = (a, b) => a.registration.localeCompare(b.registration);
      list.sort(sort === "miles" ? (a, b) => b.miles_30 - a.miles_30 || byReg(a, b)
              : sort === "fewest" ? (a, b) => a.miles_30 - b.miles_30 || byReg(a, b)
              : sort === "reg" ? byReg
              : (a, b) => dueSort(a, b, check));

      const title = status === "all" ? "All vehicles" : `${CHECK_NAME[check]} ${STATUS_WORDS[status]}`;
      main.innerHTML = `
        <a class="back-link" href="${link("", { view })}">Back to ${esc(viewName(view))}</a>
        <h1>${title} – ${esc(viewName(view))} <span class="muted">(${list.length})</span></h1>
        <form id="filters" class="toolbar" style="margin-bottom:var(--space-4)">
          ${m.scope.level !== "base" ? `<div class="field"><label for="fView">Showing</label><select id="fView">${viewOptions(view)}</select></div>` : ""}
          <div class="field"><label for="fCheck">Check</label>
            <select id="fCheck">${Object.entries(CHECK_NAME).map(([k, l]) => `<option value="${k}"${k === check ? " selected" : ""}>${l}</option>`).join("")}</select></div>
          <div class="field"><label for="fStatus">Status</label>
            <select id="fStatus">${[["all", "Any"], ["overdue", "Overdue"], ["due", "Due soon"], ["notbooked", "Needs booking"], ["ok", "OK"]].map(([k, l]) =>
              `<option value="${k}"${k === status ? " selected" : ""}>${l}</option>`).join("")}</select></div>
          <div class="field"><label for="fSort">Sort by</label>
            <select id="fSort">${Object.entries(SORTS).map(([k, l]) =>
              `<option value="${k}"${k === sort ? " selected" : ""}>${l}</option>`).join("")}</select></div>
          <div class="field"><label for="fFind">Find</label>
            <input id="fFind" type="search" placeholder="Reg, make, type…" value="${esc(q.get("find") || "")}"></div>
        </form>
        ${list.length ? vehicleTable(list, check, { oneBase: view.startsWith("b:"), miles: true }) : `<div class="empty">Nothing here – all good.</div>`}`;

      const $ = id => document.getElementById(id);
      const go = () => {
        const so = $("fSort").value, ch = $("fCheck").value;
        location.hash = link("list", { status: $("fStatus").value, check: ch === "service" ? "service" : "",
          view: $("fView") ? $("fView").value : view, sort: so === "due" ? "" : so, find: $("fFind").value.trim() });
      };
      ["fStatus", "fSort", "fCheck", "fView"].forEach(id => { if ($(id)) $(id).addEventListener("change", go); });
      let t;
      $("fFind").addEventListener("input", () => { clearTimeout(t); t = setTimeout(go, 500); });
      $("filters").addEventListener("submit", e => { e.preventDefault(); go(); });
      if (q.get("find") != null) { const f = $("fFind"); f.focus(); f.setSelectionRange(f.value.length, f.value.length); }
      wireTable();
    }

    function vehicleTable(list, check, opts) {
      opts = opts || {};
      const canRecord = m.role.can_record && opts.actions;
      const isSvc = check === "service";
      return `<div class="table-wrap"><table class="table">
        <thead><tr><th>Vehicle</th>${opts.oneBase ? "" : "<th>Base</th>"}<th>Type</th><th>Make &amp; model</th>
          <th>${isSvc ? "Service due" : "MOT due"}</th><th>Status</th><th>Booking</th>
          ${opts.miles ? '<th class="num">Miles (30 days)</th>' : ""}
          ${canRecord ? "<th><span class='visually-hidden'>Actions</span></th>" : ""}</tr></thead>
        <tbody>${list.map(v => {
          const s = S(v, check);
          const due = isSvc
            ? `${fmtDate(s.effective_due_date)}<div class="small muted">${serviceDueText(s)}</div>`
            : `${fmtDate(v.due_date)}<div class="small muted">${daysText(v.days_to_due)}${v.first_mot ? " · first MOT" : ""}</div>`;
          const recordHref = link(isSvc ? "record-service" : "record", { reg: v.registration });
          return `<tr data-href="${link("van/" + v.registration)}">
          <td><a class="reg row-link" href="${link("van/" + v.registration)}">${esc(v.registration)}</a></td>
          ${opts.oneBase ? "" : `<td>${esc(v.base_name)}</td>`}
          <td>${esc(v.class_short)}</td>
          <td>${esc(v.make)} ${esc(v.model)}</td>
          <td class="nums">${due}</td>
          <td>${statusBadge(s.status)}</td>
          <td>${bookingBadge(s)}</td>
          ${opts.miles ? `<td class="num">${fmtNum(v.miles_30)}${v.days_used_30 < 20 ? `<div class="small muted">used ${v.days_used_30} days</div>` : ""}</td>` : ""}
          ${canRecord ? `<td><div class="row" style="flex-wrap:nowrap">
              ${!s.booked
                ? `<button class="btn btn--secondary action-btn" type="button" data-book="${esc(v.registration)}" data-kind="${check}">Book ${isSvc ? "service" : "MOT"}</button>`
                : `<a class="btn btn--ghost action-btn" href="${recordHref}">Record ${isSvc ? "service" : "MOT"}</a>`}</div></td>` : ""}
        </tr>`;
        }).join("")}</tbody></table></div>`;
    }

    function wireTable() {
      main.querySelectorAll("tr[data-href]").forEach(tr => tr.addEventListener("click", e => {
        if (e.target.closest("a, button")) return;
        location.hash = tr.dataset.href;
      }));
      wireActions(main, "mot");
    }
    /* ---------------- WORK: one list per check – Reg · Stage · What's happening · Next step ---------------- */

    const today = () => NB.isoToday();
    const normReg = s => String(s || "").toUpperCase().replace(/[^A-Z0-9]/g, "");

    // Where each van is in the process, for one check (null = nothing to show)
    function stageOf(v, check) {
      const s = S(v, check);
      if (s.awaiting_result) return "result";
      if (check === "mot" && v.retest && !s.booked) return "retest";
      if (!s.booked && s.status !== "OK") return "book";
      if (s.booked) return "booked";
      return null;
    }
    const NEEDS_ACTION = new Set(["result", "retest", "book"]);
    const STAGE_ORDER = { result: 0, book: 1, retest: 2, booked: 3 };

    function workItems(list, check) {
      return list.map(v => ({ v, s: S(v, check), stage: stageOf(v, check) }))
        .filter(r => r.stage)
        .sort((a, b) => {
          const pa = STAGE_ORDER[a.stage] - (a.stage === "book" && a.s.status === "Overdue" ? 0.5 : 0);
          const pb = STAGE_ORDER[b.stage] - (b.stage === "book" && b.s.status === "Overdue" ? 0.5 : 0);
          if (pa !== pb) return pa - pb;
          if (a.stage === "booked" || a.stage === "result") return a.s.booking_date.localeCompare(b.s.booking_date);
          return dueSort(a.v, b.v, check);
        });
    }

    // How many things need doing (for the red count on "Work")
    function workCount() {
      if (!m.role.can_record) return 0;
      const list = c.vehicles.filter(v => inView(v, defaultView()));
      return ["mot", "service"].reduce((n, ch) => n + workItems(list, ch).filter(r => NEEDS_ACTION.has(r.stage)).length, 0);
    }
    function updateBadge() {
      const b = document.getElementById("workCount");
      if (!b) return;
      const n = workCount();
      b.textContent = n; b.hidden = !n;
      b.setAttribute("aria-label", n + " to do");
    }

    // The MOT position in a few plain words
    function motWhat(v) {
      const d = v.days_to_due;
      if (d < 0) return `MOT expired ${-d === 1 ? "yesterday" : -d + " days ago"} – off the road`;
      if (d === 0) return "MOT runs out today";
      return `MOT runs out ${NB.fmtDay(v.due_date, true)} – in ${d} day${d === 1 ? "" : "s"}`;
    }
    function svcWhat(s) {
      if (s.miles_left < 0) return `Service overdue – ${fmtNum(-s.miles_left)} miles over`;
      const d = NB.daysBetween(today(), s.effective_due_date);
      if (d < 0) return `Service overdue – ${-d} day${d === -1 ? "" : "s"} (6 months up)`;
      return `Service due ${NB.fmtDay(s.effective_due_date, true)} – ${fmtNum(s.miles_left)} miles left`;
    }

    function stageCell(r, check) {
      const { s, stage, v } = r;
      if (stage === "result") return `<span class="stage stage--amber">Result to log</span>`;
      if (stage === "retest") return `<span class="stage stage--amber">Failed – retest</span>`;
      if (stage === "book") return `<span class="stage ${s.status === "Overdue" ? "stage--red" : "stage--grey"}">Not booked</span>`;
      return `<span class="stage stage--green">Booked ${NB.fmtDay(s.booking_date, true)}</span>`;
    }
    function whatCell(r, check) {
      const { s, stage, v } = r;
      if (check === "service") {
        if (stage === "result") return `In for service ${NB.fmtDay(s.booking_date, true)}`;
        return svcWhat(s);
      }
      if (stage === "result") return `Tested ${NB.fmtDay(s.booking_date, true)}`;
      if (stage === "retest") return `Failed ${NB.fmtDay(v.last_test_date, true)} · ${v.days_to_due < 0 ? "off the road" : "MOT still runs to " + NB.fmtDay(v.due_date, true)}`;
      return motWhat(v) + (v.retest ? " · retest" : "");
    }
    function nextCell(r, check) {
      const reg = esc(r.v.registration);
      if (r.stage === "result") return `<button class="btn btn--primary btn-sm" type="button" data-log="${reg}">Log result</button>`;
      if (r.stage === "booked") return `<button class="linkish" type="button" data-book="${reg}">Change</button>`;
      const word = check === "service" ? "Book service" : r.stage === "retest" ? "Book retest" : "Book test";
      return `<button class="btn btn--primary btn-sm" type="button" data-book="${reg}">${word}</button>`;
    }

    function renderWork(q) {
      setNav("work");
      if (!m.role.can_record) return notAllowed("bookings");
      const check = q.get("check") === "service" ? "service" : "mot";
      const view = allowedView(q.get("view"));
      const oneBase = view.startsWith("b:");
      const list = c.vehicles.filter(v => inView(v, view));
      const items = workItems(list, check);
      const need = items.filter(r => NEEDS_ACTION.has(r.stage)), booked = items.filter(r => r.stage === "booked");
      const f = ["all", "action", "booked"].includes(q.get("f")) ? q.get("f") : "all";
      const shown = f === "action" ? need : f === "booked" ? booked : items;
      const W = params => link("work", Object.assign({ check: check === "service" ? "service" : "", view: view === defaultView() ? "" : view, f: f === "all" ? "" : f }, params));
      const isSvc = check === "service";

      main.innerHTML = `
        <div class="page-head">
          <h1>${isSvc ? "Services" : "MOTs"}</h1>
          <div class="pill-toggle" role="group" aria-label="MOT or service">
            <button type="button" aria-pressed="${!isSvc}" data-goto="${W({ check: "" })}">MOT</button>
            <button type="button" aria-pressed="${isSvc}" data-goto="${W({ check: "service" })}">Service</button>
          </div>
          <span class="grow"></span>
          ${m.scope.level !== "base" ? `<div class="field" style="min-width:200px"><label for="wView" class="visually-hidden">Showing</label><select id="wView">${viewOptions(view)}</select></div>` : ""}
          ${isSvc ? `<a class="btn btn--primary" href="${link("record-service", { back: "work" })}">+ Log service</a>`
                  : `<button class="btn btn--primary" type="button" data-log="" title="Shortcut: L">+ Log MOT result</button>`}
        </div>
        <div class="chips" role="group" aria-label="Show">
          <button class="chip" type="button" aria-pressed="${f === "all"}" data-goto="${W({ f: "" })}">All <span class="chip__n">${items.length}</span></button>
          <button class="chip" type="button" aria-pressed="${f === "action"}" data-goto="${W({ f: "action" })}">Needs action <span class="chip__n${need.length ? " chip__n--alert" : ""}">${need.length}</span></button>
          <button class="chip" type="button" aria-pressed="${f === "booked"}" data-goto="${W({ f: "booked" })}">Booked <span class="chip__n">${booked.length}</span></button>
        </div>
        ${shown.length ? `<table class="work">
          <thead><tr><th class="c-reg">Reg</th><th class="c-stage">Stage</th><th class="c-what">What's happening</th><th class="c-next">Next step</th></tr></thead>
          <tbody>${shown.map(r => `<tr>
            <td class="c-reg"><a class="reg" href="${link("van/" + r.v.registration)}">${esc(r.v.registration)}</a>${oneBase ? "" : `<span class="where">${esc(r.v.base_name)}</span>`}</td>
            <td class="c-stage">${stageCell(r, check)}</td>
            <td class="c-what">${whatCell(r, check)}</td>
            <td class="c-next">${nextCell(r, check)}</td></tr>`).join("")}</tbody>
        </table>` : `<div class="empty">${f === "booked" ? "Nothing booked at the moment." : `Nothing to do – every ${isSvc ? "service" : "MOT"} is in date or booked.`}</div>`}
        <p class="work-note">Showing vans ${isSvc ? "with a service" : "with an MOT"} due in the next ${c.rules[isSvc ? "service_warning_days" : "mot_warning_days"].value} days, or with something still to do.</p>`;

      main.querySelectorAll("[data-goto]").forEach(b => b.addEventListener("click", () => { location.hash = b.dataset.goto; }));
      const wv = document.getElementById("wView");
      if (wv) wv.addEventListener("change", () => { location.hash = link("work", { check: isSvc ? "service" : "", view: wv.value }); });
      wireActions(main, check);
    }

    // Buttons with data-book / data-log anywhere on a page
    function wireActions(root, check) {
      root.querySelectorAll("[data-book]").forEach(b => b.addEventListener("click", () => openBook(b.dataset.book, b.dataset.kind || check)));
      root.querySelectorAll("[data-log]").forEach(b => b.addEventListener("click", () => {
        if ((b.dataset.kind || check) === "service") location.hash = link("record-service", { reg: b.dataset.log, back: currentHash() });
        else openLogPanel(b.dataset.log);
      }));
    }
    const currentHash = () => location.hash.replace(/^#\/?/, "") || "";

    // Shortcut: L opens "Log MOT result" (not while typing)
    document.addEventListener("keydown", e => {
      if (e.key.toLowerCase() !== "l" || e.ctrlKey || e.metaKey || e.altKey) return;
      if (document.querySelector(".panel") || /INPUT|TEXTAREA|SELECT/.test(document.activeElement.tagName)) return;
      if (!m || !m.role.can_record) return;
      e.preventDefault(); openLogPanel("");
    });

    /* ---------------- toast (short "done" message) ---------------- */
    function toast(html) {
      let t = document.getElementById("toast");
      if (!t) {
        t = document.createElement("div");
        t.id = "toast"; t.setAttribute("role", "status");
        t.style.cssText = "position:fixed;left:50%;bottom:24px;transform:translateX(-50%);z-index:90;max-width:calc(100% - 32px);padding:10px 16px;border-radius:8px;background:var(--text);color:var(--bg);box-shadow:0 8px 24px rgb(0 0 0 / .2);font-size:var(--text-md)";
        document.body.appendChild(t);
      }
      t.innerHTML = html; t.hidden = false;
      clearTimeout(t._h); t._h = setTimeout(() => { t.hidden = true; }, 5000);
    }

    /* ---------------- LOG MOT RESULT: side panel or page ----------------
       People type from the certificate; the app checks and warns, it never fills the answers in
       (except "Fetch from DVSA", which fills everything and says so). */

    const TICK = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" aria-hidden="true"><path d="M5 12l5 5 9-10"/></svg>';
    const CROSS = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" aria-hidden="true"><path d="M6 6l12 12M18 6L6 18"/></svg>';

    let logDirty = false;   // something saved – the page behind needs redrawing on close

    function openLogPanel(reg) {
      logDirty = false;
      const p = NB.openPanel("Log MOT result", { onClose: () => { if (logDirty) render(); } });
      logForm(p.el, { reg, head: p.head, close: p.close, mode: "panel" });
    }

    function renderLogPage(q) {
      setNav("work");
      if (!m.role.can_record) return notAllowed("MOTs");
      main.innerHTML = `<a class="back-link" href="${link("work")}">MOTs</a>
        <div class="page-form"><div class="panel__head"><h2>Log MOT result</h2><span data-steps></span></div><div data-lf style="display:flex;flex-direction:column"></div></div>`;
      logForm(main.querySelector("[data-lf]"), { reg: (q.get("reg") || "").toUpperCase(), head: main.querySelector("[data-steps]"),
        close: () => { location.hash = link("work"); }, mode: "page" });
    }

    function logForm(root, opts) {
      const state = { reg: opts.reg || "", result: "", test: "", expiry: "", miles: "", centre: "", adv: "", fails: "", fromDvsa: false, centreFromBooking: false };
      const mineVans = () => c.vehicles.filter(x => inView(x, defaultView()) || m.scope.level === "company");
      const veh = () => c.vehicleByReg.get(normReg(state.reg));
      // Default the test centre from the booking (people only change it if it's wrong)
      function centreDefault() {
        const v = veh();
        const cen = v && v.booking_centre && c.centres.find(x => x.name === v.booking_centre);
        state.centre = cen ? String(cen.id) : ""; state.centreFromBooking = !!cen;
      }
      if (veh()) centreDefault();

      const steps = n => { opts.head.innerHTML = `<ol class="steps">${["Details", "Check", "Saved"].map((t, i) =>
        `<li${i + 1 === n ? ' aria-current="step"' : ""}>${i + 1} ${t}</li>${i < 2 ? "<li aria-hidden=\"true\">›</li>" : ""}`).join("")}</ol>`; };

      /* ---- step 1: details ---- */
      function edit(focusName) {
        steps(1);
        const v = veh();
        root.innerHTML = `<form class="lf-form" novalidate style="display:flex;flex-direction:column;flex:1;min-height:0">
          <div class="panel__body"><div class="lf">
            <div class="field">
              <label for="lfReg">Reg</label>
              <div class="lf-reg">
                <div class="ta"><input class="input" id="lfReg" name="reg" autocomplete="off" spellcheck="false" value="${esc(state.reg)}"
                    role="combobox" aria-autocomplete="list" aria-expanded="false" aria-controls="lfRegList" aria-describedby="lfRegHint">
                  <ul class="ta__list" id="lfRegList" role="listbox" hidden></ul></div>
                <button class="btn btn--ghost" type="button" data-dvsa>Fetch from DVSA</button>
              </div>
              <div class="lf-hint" id="lfRegHint"></div>
            </div>
            <div class="lf-note" data-note hidden></div>
            <div class="field">
              <span class="label" id="lfResLabel">Result</span>
              <div class="result-tiles" role="radiogroup" aria-labelledby="lfResLabel">
                ${["Pass", "Fail"].map(r => `<button type="button" class="result-tile" role="radio" data-v="${r}" aria-checked="${state.result === r}">
                  <span class="result-tile__icon">${r === "Pass" ? TICK : CROSS}</span>${r}</button>`).join("")}
              </div>
            </div>
            <div class="lf-two">
              <div class="field"><label for="lfTest">Test date</label>
                <input class="input" id="lfTest" name="test" inputmode="numeric" placeholder="dd/mm/yyyy" autocomplete="off" value="${esc(state.test)}">
                <div class="lf-hint" data-prev="test"></div></div>
              <div class="field" data-pass><label for="lfExp">New expiry date</label>
                <input class="input" id="lfExp" name="expiry" inputmode="numeric" placeholder="dd/mm/yyyy" autocomplete="off" value="${esc(state.expiry)}">
                <div class="lf-hint" data-prev="expiry"></div></div>
            </div>
            <div class="field" data-fail><label for="lfFails">Reasons for failure <span class="muted">(one per line)</span></label>
              <textarea class="input" id="lfFails" name="fails" rows="3">${esc(state.fails)}</textarea></div>
            <div class="lf-two">
              <div class="field"><label for="lfMiles">Mileage</label>
                <input class="input" id="lfMiles" name="miles" inputmode="numeric" autocomplete="off" value="${esc(state.miles)}">
                <div class="lf-hint" data-prev="miles">As shown on the certificate</div></div>
              <div class="field"><label for="lfCentre">Test centre</label>
                <select class="input" id="lfCentre" name="centre"><option value="">Choose…</option>${c.centres.map(x =>
                  `<option value="${x.id}"${String(x.id) === state.centre ? " selected" : ""}>${esc(x.name)}</option>`).join("")}</select>
                <div class="lf-hint" data-centre-hint>${state.centreFromBooking ? "From the booking" : ""}</div></div>
            </div>
            <div class="field"><label for="lfAdv">Advisories <span class="muted">(if any, one per line)</span></label>
              <textarea class="input" id="lfAdv" name="adv" rows="2">${esc(state.adv)}</textarea></div>
            <div class="errbox" data-err role="alert"></div>
          </div></div>
          <div class="panel__foot">
            <button class="btn btn--primary" type="submit">Check answers</button>
            <button class="btn btn--ghost" type="button" data-cancel>Cancel</button>
          </div></form>`;

        const f = root.querySelector("form"), $f = n => f.elements[n];
        const showResult = () => {
          f.querySelectorAll(".result-tile").forEach(b => b.setAttribute("aria-checked", String(b.dataset.v === state.result)));
          f.querySelector("[data-pass]").hidden = state.result === "Fail";
          f.querySelector("[data-fail]").hidden = state.result !== "Fail";
        };
        const regHint = () => {
          const el = f.querySelector("#lfRegHint"), vv = veh();
          el.className = "lf-hint";
          if (!state.reg) { el.textContent = "Type any part of the reg"; return; }
          if (!vv) { el.textContent = normReg(state.reg).length >= 6 ? "No van with that reg" : ""; el.className = "lf-hint lf-hint--bad"; return; }
          el.textContent = vv.days_to_due < 0 ? `MOT expired ${NB.fmtDay(vv.due_date)} – off the road` : `Current MOT runs to ${NB.fmtDay(vv.due_date)}`;
        };
        const preview = name => {
          const el = f.querySelector(`[data-prev="${name}"]`);
          if (!el) return;
          const val = state[name];
          el.className = "lf-hint";
          if (name === "miles") {
            const n = parseInt(String(val).replace(/[^0-9]/g, ""), 10);
            el.textContent = val && !isNaN(n) ? fmtNum(n) + " miles" : "As shown on the certificate";
            return;
          }
          const iso = NB.parseTyped(val);
          if (iso === "") el.textContent = "";
          else if (iso === null) { el.textContent = "Not a date – type it as dd/mm/yyyy"; el.className = "lf-hint lf-hint--bad"; }
          else el.textContent = NB.fmtDay(iso);
        };
        showResult(); regHint(); ["test", "expiry", "miles"].forEach(preview);
        if (state.fromDvsa) note();

        // Typing anywhere keeps the state; a typed change means it's no longer "as fetched"
        f.addEventListener("input", e => {
          const n = e.target.name;
          if (!n || n === "reg") return;
          state[n] = e.target.value;
          if (n === "centre") { state.centreFromBooking = false; f.querySelector("[data-centre-hint]").textContent = ""; }
          preview(n);
        });
        f.addEventListener("change", e => { if (e.target.name === "centre") { state.centre = e.target.value; state.centreFromBooking = false; f.querySelector("[data-centre-hint]").textContent = ""; } });

        // Result tiles: click, or arrow keys / P / F
        f.querySelectorAll(".result-tile").forEach(b => {
          b.addEventListener("click", () => { state.result = b.dataset.v; showResult(); });
          b.addEventListener("keydown", e => {
            const k = e.key.toLowerCase();
            const pick = k === "p" ? "Pass" : k === "f" ? "Fail" : /arrow/.test(k) ? (state.result === "Pass" ? "Fail" : "Pass") : null;
            if (!pick) return;
            e.preventDefault(); state.result = pick; showResult();
            f.querySelector(`.result-tile[data-v="${pick}"]`).focus();
          });
        });

        // Reg type-ahead
        const input = $f("reg"), listEl = f.querySelector("#lfRegList");
        let hits = [], sel = -1;
        const draw = () => {
          listEl.innerHTML = hits.map((x, i) => `<li class="ta__item" role="option" id="lfo${i}" aria-selected="${i === sel}" data-reg="${esc(x.registration)}">
              <span class="reg">${esc(x.registration)}</span><small>${x.awaiting_result ? "Result to log" : x.days_to_due < 0 ? "MOT expired" : "MOT " + NB.fmtDay(x.due_date, true)}${m.scope.level === "base" ? "" : " · " + esc(x.base_name)}</small></li>`).join("");
          const open = hits.length > 0;
          listEl.hidden = !open; input.setAttribute("aria-expanded", String(open));
          if (sel >= 0) input.setAttribute("aria-activedescendant", "lfo" + sel); else input.removeAttribute("aria-activedescendant");
        };
        const choose = reg => {
          state.reg = reg; input.value = reg; hits = []; draw(); centreDefault();
          const cs = $f("centre"); cs.value = state.centre;
          f.querySelector("[data-centre-hint]").textContent = state.centreFromBooking ? "From the booking" : "";
          regHint();
          f.querySelector(".result-tile").focus();
        };
        input.addEventListener("input", () => {
          state.reg = input.value; state.fromDvsa = false; f.querySelector("[data-note]").hidden = true;
          const t = normReg(input.value);
          // Vans waiting for a result come first
          hits = t.length < 1 ? [] : mineVans().filter(x => normReg(x.registration).includes(t))
            .sort((a, b) => (b.awaiting_result - a.awaiting_result) || a.registration.localeCompare(b.registration)).slice(0, 8);
          if (hits.length === 1 && normReg(hits[0].registration) === t) hits = [];
          sel = hits.length ? 0 : -1;
          draw(); regHint();
        });
        input.addEventListener("keydown", e => {
          if (!hits.length) return;
          if (e.key === "ArrowDown") { e.preventDefault(); sel = (sel + 1) % hits.length; draw(); }
          else if (e.key === "ArrowUp") { e.preventDefault(); sel = (sel - 1 + hits.length) % hits.length; draw(); }
          else if (e.key === "Enter" || e.key === "Tab") { if (sel >= 0) { e.preventDefault(); choose(hits[sel].registration); } }
          else if (e.key === "Escape") { e.preventDefault(); hits = []; draw(); }
        });
        input.addEventListener("blur", () => setTimeout(() => { hits = []; draw(); }, 150));
        listEl.addEventListener("mousedown", e => { const li = e.target.closest("[data-reg]"); if (li) { e.preventDefault(); choose(li.dataset.reg); } });

        f.querySelector("[data-dvsa]").addEventListener("click", fetchDvsa);
        f.querySelector("[data-cancel]").addEventListener("click", opts.close);
        f.addEventListener("submit", e => { e.preventDefault(); check(); });

        const target = focusName ? f.elements[focusName] || f.querySelector(focusName) : (state.reg && veh() ? f.querySelector(".result-tile") : input);
        if (target) target.focus();
      }

      function note() {
        const el = root.querySelector("[data-note]");
        el.hidden = false;
        el.className = "lf-note";
        el.innerHTML = `Filled in from DVSA. <strong>Check each one against the certificate.</strong>` +
          `<div class="muted small" style="margin-top:4px">Demo van – this is a made-up DVSA record. Real regs will come from the DVSA itself.</div>`;
      }

      /* ---- "Fetch from DVSA" (simulated for the demo's made-up regs) ---- */
      async function fetchDvsa() {
        const v = veh(), btn = root.querySelector("[data-dvsa]"), el = root.querySelector("[data-note]");
        if (!v) { el.hidden = false; el.className = "lf-note lf-note--demo"; el.textContent = "Type or pick a reg first."; return; }
        btn.disabled = true; btn.textContent = "Fetching…";
        const testDay = v.awaiting_result ? v.booking_date : null;
        if (!testDay) {
          btn.disabled = false; btn.textContent = "Fetch from DVSA";
          el.hidden = false; el.className = "lf-note lf-note--demo";
          el.textContent = `No new test on the DVSA record for ${v.registration} since the last one logged${v.last_test_date ? " (" + NB.fmtDate(v.last_test_date) + ")" : ""}.`;
          return;
        }
        const [exp, odo] = await Promise.all([
          NB.db.rpc("mot_expiry_for", { p_vehicle_id: v.id, p_test_date: testDay }),
          NB.db.from("daily_mileage").select("odometer").eq("vehicle_id", v.id).lte("day", testDay).order("day", { ascending: false }).limit(1)
        ]);
        const num = parseInt(v.registration.replace(/\D/g, ""), 10) || 0;
        const fail = num % 4 === 0;
        const ADV = ["Nearside front tyre worn close to legal limit", "Offside rear brake disc slightly worn", "Minor oil leak, not excessive",
                     "Front wiper blade deteriorated", "Exhaust has a minor leak of exhaust gases"];
        const FAILS = ["Nearside headlamp aim too high", "Offside front brake pad less than 1.5mm thick", "Windscreen wiper does not clear the windscreen effectively"];
        state.result = fail ? "Fail" : "Pass";
        state.test = NB.toTyped(testDay);
        state.expiry = fail ? "" : NB.toTyped(exp.data);
        const o = odo.data && odo.data[0] ? odo.data[0].odometer : v.odometer;
        state.miles = o ? fmtNum(o + 6) : "";
        state.adv = num % 3 === 0 ? "" : ADV[num % ADV.length];
        state.fails = fail ? FAILS[num % FAILS.length] : "";
        centreDefault();
        state.fromDvsa = true;
        edit("[type=submit]");
      }

      /* ---- step 2: check answers ---- */
      async function check() {
        const f = root.querySelector("form"), err = f.querySelector("[data-err]");
        err.textContent = "";
        const v = veh();
        const test = NB.parseTyped(state.test), expiry = NB.parseTyped(state.expiry);
        const miles = parseInt(String(state.miles).replace(/[^0-9]/g, ""), 10);
        const lines = t => (t || "").split("\n").map(x => x.trim()).filter(Boolean);
        const errors = [];
        const bad = (msg, field) => { errors.push({ msg, field }); };
        if (!v) bad(state.reg ? `There's no van ${normReg(state.reg)} – pick one from the list.` : "Type the reg.", "reg");
        if (!state.result) bad("Choose Pass or Fail.", ".result-tile");
        if (!test) bad(test === "" ? "Type the test date." : "The test date isn't a real date – type it as dd/mm/yyyy.", "test");
        else if (test > today()) bad("The test date can't be in the future.", "test");
        else if (test < NB.isoToday(-90)) bad("The test date is more than 90 days ago – check it.", "test");
        if (state.result === "Pass") {
          if (!expiry) bad(expiry === "" ? "Type the new expiry date from the certificate." : "The expiry isn't a real date – type it as dd/mm/yyyy.", "expiry");
          else if (test && expiry <= test) bad("The expiry must be after the test date.", "expiry");
        }
        if (state.result === "Fail" && !lines(state.fails).length) bad("Add at least one reason for failure.", "fails");
        if (!(miles >= 0)) bad("Type the mileage from the certificate.", "miles");
        else if (v && v.last_mot_mileage && miles < v.last_mot_mileage) bad(`The mileage is lower than at the last MOT (${fmtNum(v.last_mot_mileage)}) – check the certificate.`, "miles");
        if (!state.centre) bad("Choose the test centre.", "centre");
        if (errors.length) {
          err.innerHTML = errors.map(x => esc(x.msg)).join("<br>");
          const first = errors[0].field;
          const el = f.elements[first] || f.querySelector(first);
          if (el) el.focus();
          return;
        }

        const btn = f.querySelector("[type=submit]");
        btn.disabled = true; btn.textContent = "Checking…";
        // What the rules say, the odometer on the day, and the newest test (to catch two people logging the same one)
        const [rule, odo, snap] = await Promise.all([
          state.result === "Pass" ? NB.db.rpc("mot_expiry_for", { p_vehicle_id: v.id, p_test_date: test }) : Promise.resolve({ data: null }),
          NB.db.from("daily_mileage").select("odometer").eq("vehicle_id", v.id).lte("day", test).order("day", { ascending: false }).limit(1),
          NB.db.from("mot_tests").select("id").eq("vehicle_id", v.id).order("id", { ascending: false }).limit(1)
        ]);
        btn.disabled = false; btn.textContent = "Check answers";
        const flags = {}, warnings = [];
        const warn = (field, msg) => { flags[field] = true; warnings.push(msg); };
        if (state.result === "Pass" && rule.data && expiry !== rule.data) {
          warn("expiry", `You typed <strong>${NB.fmtDate(expiry)}</strong>. The MOT rules would normally give <strong>${NB.fmtDate(rule.data)}</strong>. If the certificate says ${NB.fmtDate(expiry)}, save it as it is.`);
        }
        if (state.result === "Pass" && v.due_date > test) {
          const keep = NB.parseDate(v.due_date); keep.setMonth(keep.getMonth() - 1); keep.setDate(keep.getDate() + 1);
          if (NB.parseDate(test) < keep) warn("test", `Tested more than a month before the old expiry (${NB.fmtDate(v.due_date)}), so about ${NB.daysBetween(test, v.due_date) - 1} days of MOT are lost.`);
        }
        const odoDay = odo.data && odo.data[0] ? odo.data[0].odometer : null;
        if (odoDay && miles < odoDay - 50) warn("miles", `The mileage is lower than the van's odometer on that day (${fmtNum(odoDay)}).`);
        else if (odoDay && miles > odoDay + 500) warn("miles", `The mileage is ${fmtNum(miles - odoDay)} more than the van's odometer on that day (${fmtNum(odoDay)}).`);
        if (v.booking_date && test < v.booking_date) warn("test", `The test date is before the booking (${NB.fmtDate(v.booking_date)}).`);
        if (v.last_test_date && test <= v.last_test_date) warn("test", `There's already an MOT logged for ${NB.fmtDate(v.last_test_date)} – is this a new one?`);

        const centreName = (c.centres.find(x => String(x.id) === state.centre) || {}).name || "";
        const rows = [
          ["Reg", `<span class="reg">${esc(v.registration)}</span>`, "reg"],
          ["Result", state.result === "Pass" ? '<span class="stage stage--green">Pass</span>' : '<span class="stage stage--red">Fail</span>', ".result-tile"],
          ["Test date", NB.fmtDay(test), "test"],
          ...(state.result === "Pass" ? [["Expiry date", NB.fmtDay(expiry) + (flags.expiry ? ' <span class="text-warn" aria-label="please check">⚠</span>' : ""), "expiry"]]
                                      : [["Failed on", lines(state.fails).map(esc).join("<br>"), "fails"]]),
          ["Mileage", fmtNum(miles) + (flags.miles ? ' <span class="text-warn" aria-label="please check">⚠</span>' : ""), "miles"],
          ["Test centre", esc(centreName), "centre"],
          ["Advisories", lines(state.adv).length ? lines(state.adv).map(esc).join("<br>") : '<span class="muted">None</span>', "adv"]
        ];
        const after = state.result === "Pass"
          ? `Saving closes the booking${v.booking_date ? " for " + NB.fmtDay(v.booking_date, true) : ""}${v.status === "Overdue" ? ` and takes ${esc(v.registration)} off VOR` : ""}.`
          : `Saving closes the booking and puts ${esc(v.registration)} on the list for a retest. The old expiry (${NB.fmtDate(v.due_date)}) still stands.`;

        steps(2);
        root.innerHTML = `<div class="panel__body">
            ${warnings.length ? `<div class="warnbox" role="alert"><div class="warnbox__title">Please check</div>${warnings.map(w => `<div>${w}</div>`).join("")}</div>` : ""}
            <dl class="summary">${rows.map(([k, val, field]) => {
              const fl = (field === "expiry" && flags.expiry) || (field === "miles" && flags.miles) || (field === "test" && flags.test) ? " flag" : "";
              return `<dt class="${fl}">${k}</dt><dd class="${fl}">${val}</dd><dd class="chg${fl}"><button class="linkish" type="button" data-change="${field}">Change<span class="visually-hidden"> ${k}</span></button></dd>`;
            }).join("")}</dl>
            <p class="work-note">${after}</p>
            <div class="errbox" data-err2 role="alert"></div>
          </div>
          <div class="panel__foot">
            <button class="btn btn--primary" type="button" data-confirm>Confirm and save</button>
            <button class="btn btn--ghost" type="button" data-back>Back to edit</button>
          </div>`;
        root.querySelectorAll("[data-change]").forEach(b => b.addEventListener("click", () => edit(b.dataset.change)));
        root.querySelector("[data-back]").addEventListener("click", () => edit());
        const confirm = root.querySelector("[data-confirm]");
        confirm.focus();
        confirm.addEventListener("click", async () => {
          const err2 = root.querySelector("[data-err2]");
          confirm.disabled = true; confirm.textContent = "Saving…";
          const now = await NB.db.from("mot_tests").select("id").eq("vehicle_id", v.id).order("id", { ascending: false }).limit(1);
          const before = snap.data && snap.data[0] ? snap.data[0].id : 0, latest = now.data && now.data[0] ? now.data[0].id : 0;
          if (latest !== before) {
            err2.innerHTML = `Someone has just logged an MOT for ${esc(v.registration)}. <strong>Nothing has been saved.</strong> Close this and check whether another is still needed.`;
            confirm.textContent = "Confirm and save";
            return;
          }
          const r = await NB.db.rpc("record_mot", {
            p_registration: v.registration, p_test_date: test, p_result: state.result, p_mileage: miles,
            p_centre_id: +state.centre, p_advisories: lines(state.adv).join("|"),
            p_failure_reasons: state.result === "Fail" ? lines(state.fails).join("|") : "",
            p_expiry_date: state.result === "Pass" ? expiry : null, p_person: m.person.code });
          if (r.error) { err2.textContent = NB.friendlyError(r.error); confirm.disabled = false; confirm.textContent = "Confirm and save"; return; }
          logDirty = true;
          await reload();
          saved(v.registration, state.result, expiry, lines(state.adv).length);
        });
      }

      /* ---- step 3: saved ---- */
      function saved(reg, result, expiry, nAdv) {
        steps(3);
        const nv = c.vehicleByReg.get(reg);
        root.innerHTML = `<div class="panel__body"><div class="saved">
            <div class="saved__tick">${TICK.replace('stroke-width="3"', 'stroke-width="2.5" width="20" height="20"')}</div>
            <div class="saved__title">MOT saved for <span class="reg">${esc(reg)}</span></div>
            <div class="muted">${result === "Pass"
              ? `Pass · valid to ${NB.fmtDate(expiry)}${nAdv ? ` · ${nAdv} advisor${nAdv === 1 ? "y" : "ies"}` : ""}`
              : `Fail · now on the list for a retest · old expiry ${NB.fmtDate(nv.due_date)} still stands`}</div>
          </div></div>
          <div class="panel__foot">
            <button class="btn btn--primary" type="button" data-again>Log another MOT</button>
            <button class="btn btn--ghost" type="button" data-done>${opts.mode === "panel" ? "Back to where I was" : "Back to MOTs"}</button>
          </div>`;
        updateBadge();
        root.querySelector("[data-again]").focus();
        root.querySelector("[data-again]").addEventListener("click", () => {
          Object.assign(state, { reg: "", result: "", test: "", expiry: "", miles: "", centre: "", adv: "", fails: "", fromDvsa: false, centreFromBooking: false });
          edit();
        });
        root.querySelector("[data-done]").addEventListener("click", opts.close);
      }

      edit();
    }

    /* ---------------- BOOK: side panel (MOT or service) ---------------- */

    function openBook(reg, kind) {
      const isSvc = kind === "service";
      const v = c.vehicleByReg.get(reg);
      const s = S(v, kind);
      const retest = !isSvc && v.retest;
      const title = s.booked && !s.awaiting_result ? `Change ${isSvc ? "service" : "MOT"} booking` : isSvc ? "Book service" : retest ? "Book retest" : "Book MOT";
      const p = NB.openPanel(title);
      const daysLeft = isSvc ? NB.daysBetween(today(), s.effective_due_date) : v.days_to_due;
      const suggest = s.booked && s.booking_date >= today() ? s.booking_date : NB.isoToday(daysLeft > 3 ? Math.min(daysLeft - 2, 14) : 1);
      const opts = isSvc ? c.providers : c.centres;
      const usual = isSvc ? s.booking_provider : s.booking_centre;
      const pick = opts.find(o => o.name === usual) || opts.find(o => o.name.startsWith(v.base_name)) || opts[0];
      p.el.innerHTML = `<form novalidate style="display:flex;flex-direction:column;flex:1;min-height:0">
        <div class="panel__body"><div class="lf">
          <div><span class="reg" style="font-size:1.05rem">${esc(reg)}</span>
            <div class="lf-hint">${isSvc ? svcWhat(s) : motWhat(v)}${s.booked && !s.awaiting_result ? ` · booked ${NB.fmtDay(s.booking_date, true)}` : ""}</div></div>
          <div class="field"><label for="bkDate">Date</label>
            <input class="input" id="bkDate" type="date" value="${suggest}" min="${today()}" max="${NB.isoToday(120)}" required>
            <div class="lf-hint" data-prev></div></div>
          <div class="field"><label for="bkWhere">${isSvc ? "Workshop" : "Test centre"}</label>
            <select class="input" id="bkWhere">${opts.map(o => `<option value="${o.id}"${o.id === pick.id ? " selected" : ""}>${esc(o.name)}</option>`).join("")}</select></div>
          <div class="field"><label for="bkNotes">Notes <span class="muted">(optional)</span></label>
            <input class="input" id="bkNotes" type="text" maxlength="500" value="${s.status === "Overdue" ? (isSvc ? "Over the mileage – first free slot" : "Off the road until MOT") : ""}"></div>
          <div class="errbox" data-err role="alert"></div>
        </div></div>
        <div class="panel__foot"><button class="btn btn--primary" type="submit">Book</button><button class="btn btn--ghost" type="button" data-cancel>Cancel</button></div>
      </form>`;
      const f = p.el.querySelector("form"), d = f.querySelector("#bkDate");
      const prev = () => { f.querySelector("[data-prev]").textContent = d.value ? NB.fmtDay(d.value) + (d.value === today() ? " – today" : "") : ""; };
      d.addEventListener("input", prev); prev();
      f.querySelector("[data-cancel]").addEventListener("click", p.close);
      d.focus();
      f.addEventListener("submit", async e => {
        e.preventDefault();
        const err = f.querySelector("[data-err]");
        err.textContent = "";
        if (!d.value || d.value < today()) { err.textContent = "Pick a date from today on."; d.focus(); return; }
        if (d.value > NB.isoToday(120)) { err.textContent = "That's more than 4 months away – check the date."; d.focus(); return; }
        const where = f.querySelector("#bkWhere");
        const args = { p_registration: reg, p_date: d.value, p_notes: f.querySelector("#bkNotes").value, p_person: m.person.code };
        if (isSvc) args.p_provider_id = +where.value; else args.p_centre_id = +where.value;
        const btn = f.querySelector("[type=submit]");
        btn.disabled = true; btn.textContent = "Booking…";
        const r = await NB.db.rpc(isSvc ? "book_service" : "book_mot", args);
        if (r.error) { err.textContent = NB.friendlyError(r.error); btn.disabled = false; btn.textContent = "Book"; return; }
        await reload();
        p.close();
        render();
        toast(`Booked <strong>${esc(reg)}</strong> – ${isSvc ? "service" : retest ? "retest" : "MOT"} ${NB.fmtDay(d.value, true)} at ${esc(where.selectedOptions[0].textContent)}`);
      });
    }

    /* ---------------- VEHICLE "SPORTS CARD" ---------------- */

    async function renderVan(reg) {
      setNav("");
      const v = c.vehicleByReg.get(reg);
      if (!v) { main.innerHTML = `<a class="back-link" href="#/">Home</a><div class="empty">Vehicle ${esc(reg)} not found.</div>`; return; }
      main.innerHTML = `<p class="status-line">Loading ${esc(reg)}…</p>`;
      const [res, dres, sres] = await Promise.all([
        NB.db.from("mot_history").select("*").eq("vehicle_id", v.id).order("test_date", { ascending: false }).order("id", { ascending: false }),
        NB.db.from("daily_mileage").select("day,miles,odometer").eq("vehicle_id", v.id).order("day"),
        NB.db.from("service_history").select("*").eq("vehicle_id", v.id).order("service_date", { ascending: false }).order("id", { ascending: false })
      ]);
      [res, dres, sres].forEach(r => { if (r.error) throw r.error; });
      const hist = res.data, svcHist = sres.data, s = v.svc;

      // Weekly miles for this van, last 52 complete weeks
      const wk = new Map();
      dres.data.forEach(d => {
        const dt = NB.parseDate(d.day); dt.setDate(dt.getDate() - ((dt.getDay() + 6) % 7));
        const key = dt.getFullYear() + "-" + String(dt.getMonth() + 1).padStart(2, "0") + "-" + String(dt.getDate()).padStart(2, "0");
        wk.set(key, (wk.get(key) || 0) + d.miles);
      });
      const thisMonday = NB.isoToday(-((new Date().getDay() + 6) % 7));
      const vanWeeks = [...wk.entries()].filter(([k]) => k < thisMonday).sort().slice(-52)
        .map(([k, mi]) => ({ label: shortDate(k), value: mi, tip: "Week of " + shortDate(k) + ": " + fmtNum(mi) + " miles" }));
      const offDays = dres.data.filter(d => d.day >= NB.isoToday(-30) && d.miles === 0).length;

      const passes = hist.filter(h => h.result === "Pass" && h.mileage != null);
      let perYear = null;
      if (passes.length >= 2) {
        const a = passes[passes.length - 1], b = passes[0];
        const yrs = (NB.parseDate(b.test_date) - NB.parseDate(a.test_date)) / (365.25 * 864e5);
        if (yrs > 0.5) perYear = Math.round((b.mileage - a.mileage) / yrs / 100) * 100;
      }
      const lastPass = hist.find(h => h.result === "Pass");
      const lastAdvisories = lastPass && lastPass.advisories ? lastPass.advisories.split("|") : [];
      const fails = hist.filter(h => h.result === "Fail").length;
      const TONE = { Overdue: "danger", "Due soon": "warn", OK: "ok" };
      const tone = TONE[v.status], stone = TONE[s.status];
      const worst = [v.status, s.status].includes("Overdue") ? "danger" : [v.status, s.status].includes("Due soon") ? "warn" : "ok";
      const canRecord = m.role.can_record;
      const age = Math.max(0, Math.floor((Date.now() - NB.parseDate(v.first_registered)) / (365.25 * 864e5)));
      const yearAgo = NB.isoToday(-365);
      const svcCost12 = svcHist.filter(h => h.service_date >= yearAgo).reduce((t, h) => t + Number(h.total_cost || 0), 0);

      const actions = (kind, booked) => {
        const word = kind === "service" ? "service" : "MOT";
        const logBtn = `<button class="btn ${booked ? "btn--primary" : "btn--ghost"}" type="button" data-log="${esc(v.registration)}" data-kind="${kind}">Log ${kind === "service" ? "service" : "MOT result"}</button>`;
        const bookBtn = booked
          ? `<button class="linkish" type="button" data-book="${esc(v.registration)}" data-kind="${kind}">Change booking</button>`
          : `<button class="btn btn--primary" type="button" data-book="${esc(v.registration)}" data-kind="${kind}">Book ${word}</button>`;
        return !canRecord ? "" : `<div class="row">${booked ? logBtn + bookBtn : bookBtn + logBtn}</div>`;
      };

      main.innerHTML = flashHtml() + `
        <a class="back-link" href="javascript:history.back()">Back</a>
        <div class="van-hero">
          <article class="card card--${worst}">
            <div class="card__eyebrow">${esc(v.class_name)}</div>
            <h1 class="van-hero__reg reg">${esc(v.registration)}</h1>
            <p style="margin:var(--space-1) 0 var(--space-3)">${esc(v.make)} ${esc(v.model)} · ${esc(v.fuel)}</p>
            <dl class="facts">
              <dt>Fleet number</dt><dd>${esc(v.fleet_number)}</dd>
              <dt>Base</dt><dd>${esc(v.base_name)} · ${esc(v.region_name)}</dd>
              <dt>First registered</dt><dd>${fmtDate(v.first_registered)} (${age} yr${age === 1 ? "" : "s"})</dd>
              <dt>Ownership</dt><dd>${esc(v.ownership)}${v.ownership === "Leased" ? ` – ${esc(v.lessor)}, ends ${fmtDate(v.lease_end)}` : ""}</dd>
            </dl>
          </article>
          <div class="tiles">
            <div class="tile tile--${tone}"><div class="tile__value">${esc(v.status)}</div>
              <div class="tile__label">MOT ${v.status === "Overdue" ? "expired" : "due"} ${fmtDate(v.due_date)}</div>
              <div class="tile__sub">${daysText(v.days_to_due)}</div></div>
            <div class="tile tile--${stone}"><div class="tile__value">${esc(s.status)}</div>
              <div class="tile__label">Service</div>
              <div class="tile__sub">${serviceDueText(s)}</div></div>
            <div class="tile tile--info"><div class="tile__value">${fmtNum(v.odometer)}</div>
              <div class="tile__label">Odometer</div><div class="tile__sub">at end of yesterday</div></div>
            <div class="tile tile--info"><div class="tile__value">${fmtNum(v.miles_30)}</div>
              <div class="tile__label">Miles – last 30 days</div><div class="tile__sub">${offDays ? offDays + " day" + (offDays === 1 ? "" : "s") + " not used" : "used every day"}</div></div>
            <div class="tile tile--info"><div class="tile__value">${fmtNum(v.miles_365)}</div>
              <div class="tile__label">Miles – last 12 months</div></div>
            <div class="tile ${lastAdvisories.length ? "tile--warn" : "tile--ok"}"><div class="tile__value">${lastAdvisories.length}</div>
              <div class="tile__label">Advisories at last MOT</div></div>
            <div class="tile tile--info"><div class="tile__value">${money(svcCost12)}</div>
              <div class="tile__label">Servicing – last 12 months</div><div class="tile__sub">demo figures</div></div>
            <div class="tile tile--soon"><div class="tile__value">Coming soon</div><div class="tile__label">Tyres</div></div>
          </div>
        </div>

        <h2 class="section-title">Mileage</h2>
        <article class="card card--plain chart-card">
          <h3>Miles per week</h3><p class="card__desc">Last 52 weeks${perYear ? ` · about ${fmtNum(perYear)} miles a year from its MOTs` : ""}</p>
          ${vanWeeks.length ? NB.barChart(vanWeeks, { ariaLabel: "Miles per week for " + v.registration, labelEvery: 6, height: 220, width: 1100 }) : `<p class="muted">No mileage recorded yet.</p>`}
          ${vanWeeks.length ? NB.chartTable(vanWeeks.map(d => ["Week of " + d.label, fmtNum(d.value)]), ["Week", "Miles"]) : ""}
        </article>

        <h2 class="section-title">Service</h2>
        <article class="card card--${stone}">
          <div class="row row--between">
            <div class="stack" style="gap:var(--space-1)">
              <div>${statusBadge(s.status)} ${bookingBadge(s)}</div>
              <div>Next service: <strong>${fmtNum(s.due_odometer)} miles</strong> or <strong>${fmtDate(s.due_date)}</strong>, whichever comes first</div>
              <div class="small muted">${serviceDueText(s)} · at about ${fmtNum(Math.round(s.miles_per_day))} miles a day, the ${s.due_by === "miles" ? "miles" : "date"} will come first</div>
              ${s.last_service_date ? `<div class="small muted">Last service: ${esc(s.last_service_type)} on ${fmtDate(s.last_service_date)} at ${fmtNum(s.last_service_odometer)} miles</div>` : ""}
              ${s.booked ? `<div>Booked for <strong>${fmtDate(s.booking_date)}</strong> at ${esc(s.booking_provider || "–")}${s.booking_notes ? ` · ${esc(s.booking_notes)}` : ""}</div>` : ""}
            </div>
            ${actions("service", s.booked)}
          </div>
        </article>

        <h2 class="section-title">MOT</h2>
        <article class="card card--${tone}">
          <div class="row row--between">
            <div class="stack" style="gap:var(--space-1)">
              <div>${statusBadge(v.status)} ${bookingBadge(v)}</div>
              <div>MOT ${v.status === "Overdue" ? "expired" : "due"} <strong>${fmtDate(v.due_date)}</strong> – ${daysText(v.days_to_due)}${v.first_mot ? " (first MOT)" : ""}</div>
              ${v.booked ? `<div>Booked for <strong>${fmtDate(v.booking_date)}</strong> at ${esc(v.booking_centre || "–")}${v.booking_notes ? ` · ${esc(v.booking_notes)}` : ""}</div>` : ""}
              ${fails ? `<div class="small muted">${fails} failed test${fails === 1 ? "" : "s"} in its history</div>` : ""}
            </div>
            ${actions("mot", v.booked)}
          </div>
          ${lastAdvisories.length ? `<h3 style="margin-top:var(--space-4)">Advisories at last MOT</h3>
              <ul class="item-list">${lastAdvisories.map(a => `<li>${esc(a)}</li>`).join("")}</ul>` : ""}
        </article>

        <h2 class="section-title">Service history</h2>
        ${svcHist.length ? `<div class="table-wrap"><table class="table">
          <thead><tr><th>Date</th><th>Type</th><th class="num">Odometer</th><th>Workshop</th><th>Defects fixed</th><th class="num">Cost</th><th>Recorded</th></tr></thead>
          <tbody>${svcHist.map(h => `<tr>
            <td class="nums">${fmtDate(h.service_date)}</td>
            <td>${esc(h.service_type)}</td>
            <td class="num">${fmtNum(h.odometer)}</td>
            <td>${esc(h.provider_name || "–")}</td>
            <td class="small">${h.defects_found ? h.defects_found.split("|").map(esc).join("; ") : '<span class="muted">None</span>'}</td>
            <td class="num">${money(h.total_cost)}</td>
            <td class="small muted">${esc(h.recorded_by || "")}<br>${NB.fmtDateTime(h.recorded_at)}</td>
          </tr>`).join("")}</tbody></table></div>`
          : `<div class="empty">No services yet – the first is due ${fmtDate(s.due_date)} or at ${fmtNum(s.due_odometer)} miles.</div>`}

        <h2 class="section-title">MOT history</h2>
        ${hist.length ? `<div class="table-wrap"><table class="table">
          <thead><tr><th>Test date</th><th>Result</th><th>Expiry</th><th class="num">Mileage</th><th>Centre</th><th>Notes</th><th>Recorded</th></tr></thead>
          <tbody>${hist.map(h => `<tr>
            <td class="nums">${fmtDate(h.test_date)}</td>
            <td>${h.result === "Pass" ? '<span class="badge badge--ok">Pass</span>' : '<span class="badge badge--danger">Fail</span>'}</td>
            <td class="nums">${h.expiry_date ? fmtDate(h.expiry_date) : "–"}</td>
            <td class="num">${fmtNum(h.mileage)}</td>
            <td>${esc(h.centre_name || "–")}</td>
            <td class="small">${h.failure_reasons ? `<strong class="text-danger">Failed:</strong> ${h.failure_reasons.split("|").map(esc).join("; ")}` : ""}
              ${h.advisories ? `<div><strong>Advisories:</strong> ${h.advisories.split("|").map(esc).join("; ")}</div>` : ""}</td>
            <td class="small muted">${esc(h.recorded_by || "")}<br>${NB.fmtDateTime(h.recorded_at)}</td>
          </tr>`).join("")}</tbody></table></div>`
          : `<div class="empty">No MOTs yet – the first is due ${fmtDate(v.due_date)}, 3 years after first registration.</div>`}`;
      wireTable();
    }
    function notAllowed(what) {
      main.innerHTML = `<div class="alert alert--warn"><strong>Not available</strong>A ${esc(m.role.label)} can view ${what} but not record them.</div>`;
    }
    function vehicleOptions(reg) {
      const regs = c.vehicles.filter(x => m.scope.level === "company" ||
        (m.scope.level === "region" ? x.region_id === m.scope.regionId : x.base_id === m.scope.baseId));
      return `<option value="">Choose…</option>` + regs.map(x =>
        `<option value="${esc(x.registration)}"${x.registration === reg ? " selected" : ""}>${esc(x.registration)} – ${esc(x.make)} ${esc(x.model)} (${esc(x.base_name)})</option>`).join("");
    }
    /* ---------------- RECORD A SERVICE ---------------- */

    function renderRecordService(q) {
      setNav("work");
      if (!m.role.can_record) return notAllowed("services");
      const reg = (q.get("reg") || "").toUpperCase();
      main.innerHTML = `
        <a class="back-link" href="#/${esc(q.get("back") || "work?check=service")}">Back</a>
        <h1>Log a service</h1>
        <form id="svcForm" class="form-panel" style="max-width:var(--width-narrow)" novalidate>
          <div class="field-row">
            <div class="field">
              <label for="sReg">Vehicle</label>
              <select id="sReg" required>${vehicleOptions(reg)}</select>
              <div id="sRegHint" class="field__hint"></div>
            </div>
            <div class="field">
              <label for="sDate">Service date</label>
              <input id="sDate" type="date" required value="${NB.isoToday()}" max="${NB.isoToday()}" min="${NB.isoToday(-90)}">
            </div>
          </div>
          <fieldset class="field" style="border:0;padding:0;margin:0">
            <legend class="label">Type</legend>
            <div class="segmented" role="group" aria-label="Service type">
              <button type="button" data-type="Interim" aria-pressed="true">Interim</button>
              <button type="button" data-type="Full" aria-pressed="false">Full</button>
            </div>
          </fieldset>
          <div class="field-row">
            <div class="field">
              <label for="sOdo">Odometer</label>
              <input id="sOdo" type="number" inputmode="numeric" min="0" step="1" required>
              <div id="sOdoHint" class="field__hint"></div>
            </div>
            <div class="field">
              <label for="sProvider">Workshop</label>
              <select id="sProvider">${c.providers.map(x => `<option value="${x.id}">${esc(x.name)}</option>`).join("")}</select>
            </div>
          </div>
          <div class="field">
            <label for="sDefects">Defects found and fixed <span class="muted">(one per line, optional)</span></label>
            <textarea id="sDefects" placeholder="e.g. Front brake pads replaced"></textarea>
          </div>
          <div class="field-row">
            <div class="field">
              <label for="sLabour">Labour (£)</label>
              <input id="sLabour" type="number" inputmode="decimal" min="0" step="0.01">
            </div>
            <div class="field">
              <label for="sParts">Parts (£)</label>
              <input id="sParts" type="number" inputmode="decimal" min="0" step="0.01">
            </div>
          </div>
          <p class="small muted">Will be recorded by <strong>${esc(m.person.name)}</strong>, with today's date and time.
            The next service is then worked out from these miles and this date.</p>
          <p id="sError" class="field__error" role="alert"></p>
          <div class="row">
            <button class="btn btn--go" type="submit">Save service</button>
            <a class="btn btn--ghost" href="#/${esc(q.get("back") || "work?check=service")}">Cancel</a>
          </div>
        </form>`;

      const $ = id => document.getElementById(id);
      let type = "Interim";
      const vehicle = () => c.vehicleByReg.get($("sReg").value);
      function updateVehicle() {
        const ve = vehicle();
        if (!ve) { $("sRegHint").textContent = ""; $("sOdoHint").textContent = ""; return; }
        $("sRegHint").textContent = `Service ${ve.svc.status === "OK" ? "OK" : ve.svc.status.toLowerCase()}: ${serviceDueText(ve.svc)}`;
        $("sOdoHint").textContent = ve.odometer ? `Odometer at end of yesterday: ${fmtNum(ve.odometer)}` : "";
        if (ve.odometer && !$("sOdo").value) $("sOdo").value = ve.odometer + 8;
        const prov = c.providers.find(x => x.name === ve.svc.booking_provider);
        if (prov) $("sProvider").value = prov.id;
        // Suggest the type: alternate with the last one
        const next = ve.svc.last_service_type === "Interim" ? "Full" : "Interim";
        main.querySelector(`[data-type="${next}"]`).click();
      }
      main.querySelectorAll("[data-type]").forEach(b => b.addEventListener("click", () => {
        type = b.dataset.type;
        main.querySelectorAll("[data-type]").forEach(x => x.setAttribute("aria-pressed", String(x === b)));
        if (!$("sLabour").dataset.touched) $("sLabour").value = type === "Full" ? 295 : 185;
        if (!$("sParts").dataset.touched) $("sParts").value = type === "Full" ? 165 : 85;
      }));
      ["sLabour", "sParts"].forEach(id => $(id).addEventListener("input", () => { $(id).dataset.touched = "1"; }));
      $("sReg").addEventListener("change", () => { $("sOdo").value = ""; updateVehicle(); });
      updateVehicle();
      if (!vehicle()) main.querySelector('[data-type="Interim"]').click();

      $("svcForm").addEventListener("submit", async e => {
        e.preventDefault();
        const err = $("sError");
        err.textContent = "";
        const ve = vehicle();
        const odo = parseInt($("sOdo").value, 10);
        if (!ve) { err.textContent = "Choose the vehicle."; $("sReg").focus(); return; }
        if (!(odo >= 0)) { err.textContent = "Enter the odometer reading."; $("sOdo").focus(); return; }
        const btn = $("svcForm").querySelector("[type=submit]");
        btn.disabled = true;
        const lines = s => s.split("\n").map(x => x.trim()).filter(Boolean).join("|");
        const r = await NB.db.rpc("record_service", {
          p_registration: ve.registration, p_service_date: $("sDate").value, p_odometer: odo,
          p_service_type: type, p_provider_id: +$("sProvider").value,
          p_work_done: type === "Full" ? "Oil and filter change|Air and fuel filters|Brake fluid check|Full safety inspection" : "Oil and filter change|Safety inspection",
          p_defects: lines($("sDefects").value),
          p_labour_cost: parseFloat($("sLabour").value) || 0, p_parts_cost: parseFloat($("sParts").value) || 0,
          p_person: m.person.code
        });
        btn.disabled = false;
        if (r.error) { err.textContent = NB.friendlyError(r.error); return; }
        await reload();
        const ns = c.vehicleByReg.get(ve.registration).svc;
        toast(`Service saved for <strong>${esc(ve.registration)}</strong> – next due at ${fmtNum(ns.due_odometer)} miles or ${fmtDate(ns.due_date)}`);
        location.replace("#/" + (q.get("back") || "work?check=service"));
      });
    }
    /* ---------------- router ---------------- */

    async function reload() { NB.invalidate(); c = await NB.loadAll(); passesByVan = null; }

    async function render() {
      try {
        NB.closePanel(true);
        const { parts, q } = parseHash();
        if (parts[0] === "list") renderList(q);
        else if (parts[0] === "van" && parts[1]) await renderVan(parts[1].toUpperCase());
        else if (parts[0] === "log-mot" || parts[0] === "record") renderLogPage(q);
        else if (parts[0] === "record-service") renderRecordService(q);
        else if (parts[0] === "work") renderWork(q);
        else if (parts[0] === "todo") { location.replace(link("", { view: q.get("view") || "", check: q.get("check") || "", kind: q.get("kind") || "" })); return; }
        else renderHome(q);
        updateBadge();
        window.scrollTo(0, 0);
      } catch (err) {
        main.innerHTML = `<div class="alert alert--danger"><strong>Something went wrong</strong>${esc(NB.friendlyError(err))}</div>`;
      }
    }

    (async function start() {
      try {
        c = await NB.loadAll();
        m = NB.requireMe(c);
        NB.showWho(m);
        if (m.role.can_record) document.querySelector('[data-nav="work"]').hidden = false;
        const fb = document.getElementById("findBtn");
        fb.hidden = false; fb.addEventListener("click", openFind);
        document.title = "neptsBI – " + m.person.name;
        window.addEventListener("hashchange", render);
        render();
      } catch (err) {
        if (err && err.message === "Not signed in") return;
        main.innerHTML = `<div class="alert alert--danger"><strong>Can't load neptsBI</strong>${esc(NB.friendlyError(err))}</div>`;
      }
    })();
  })();
  </script>
</body>
</html>
